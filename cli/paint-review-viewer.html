<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint lighting review · Ink Studio</title>
<style>
:root{color-scheme:dark;--text:#f0e5d6;--muted:#b9b4b1;--gold:#e7b876;--teal:#9fdbcb;--line:#434b4e;--panel:#20282b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 26% -15%,#3a4142,transparent 68%),#151c1f;color:var(--text);font:14px/1.5 system-ui,sans-serif}
main{max-width:1300px;margin:auto;padding:32px clamp(16px,4vw,45px)}p,h1,h2{margin:0}h1,h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.048em}h1{font-size:clamp(42px,7vw,78px);line-height:1;margin:4px 0 8px}h2{font-size:24px}
p{color:var(--muted)}header,.toolbar,.bar,.plate-footer{display:flex;align-items:center;justify-content:space-between;gap:10px}
header{align-items:end;margin-bottom:18px}.eyebrow,.metadata,.angle,.caption{font:11px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a,button,select{font:inherit;text-decoration:none;color:var(--text);background:#2a3639;border:1px solid #66716f;border-radius:5px;padding:6px 9px}button,select{cursor:pointer}.actions a:hover,button:hover,select:hover{border-color:var(--teal)}:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.toolbar{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#20282a;margin-bottom:13px}.toolbar label{display:flex;align-items:center;gap:9px;flex:1;font-size:13px}.toolbar input{flex:1;min-width:50px;accent-color:var(--gold)}.angle{min-width:46px;text-align:right}.toolbar button{min-width:106px}.toolbar button[aria-pressed=true]{color:var(--teal);border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin:0}
.bar{padding:10px 12px}.switches{display:flex;gap:5px;flex-wrap:wrap}.switches select{min-width:0;padding:4px 6px;font-size:12px}.stage{display:grid;place-items:center;position:relative;min-height:365px;border-block:1px solid var(--line);background:radial-gradient(ellipse at 51% 43%,#3d4d4a,transparent 72%),#1b2529;isolation:isolate}
.stage::before{content:"";position:absolute;inset:9px;border:1px solid #78858542;z-index:-1;background:repeating-linear-gradient(90deg,transparent 0 31px,#c2ccbe07 31px 32px),repeating-linear-gradient(0deg,transparent 0 31px,#c2ccbe07 31px 32px)}
.stage img{display:block;width:100%;height:100%;max-height:490px;object-fit:contain;image-rendering:pixelated}.plate-footer{min-height:54px;padding:8px 12px;font-size:12px}.plate-footer p{max-width:68%}.caption{color:var(--teal);text-align:right}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;font-size:12px}.metadata{white-space:nowrap}
@media(max-width:880px){header{flex-wrap:wrap}.stage{min-height:285px}.bar{align-items:start}}
@media(max-width:690px){.grid{grid-template-columns:1fr}.stage{min-height:220px}}
@media(max-width:390px){.bar{flex-direction:column;align-items:stretch}.plate-footer{gap:5px}.toolbar label{gap:3px}.toolbar button{min-width:0}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">Ink Studio · Paint lighting review</div><h1 id="title"></h1><p>Compare surface channels with a shared light sweep and independent camera ranges.</p></div>
    <div class="actions"><a href="comparison.png">Contact sheet</a><a href="review.json" download>Review data</a></div>
  </header>
  <section class="toolbar" aria-label="Light controls">
    <label>Key angle<input type="range" id="light" aria-label="Key angle"></label>
    <output class="angle" id="angle" for="light"></output>
    <button type="button" id="play" aria-pressed="false">Play sweep</button>
  </section>
  <div class="grid">
    <figure class="card" id="left">
      <div class="bar"><h2></h2><div class="switches"><select data-mode aria-label="Left channel"></select><select data-range aria-label="Left camera range"></select></div></div>
      <div class="stage"><img alt=""></div>
      <figcaption class="plate-footer"><p data-description></p><span class="caption" data-evidence></span></figcaption>
    </figure>
    <figure class="card" id="right">
      <div class="bar"><h2></h2><div class="switches"><select data-mode aria-label="Right channel"></select><select data-range aria-label="Right camera range"></select></div></div>
      <div class="stage"><img alt=""></div>
      <figcaption class="plate-footer"><p data-description></p><span class="caption" data-evidence></span></figcaption>
    </figure>
  </div>
  <div class="note"><p id="target"></p><span class="metadata" id="native"></span></div>
</main>
<script src="review-data.js"></script><script src="review.js"></script>
</body>
</html>
