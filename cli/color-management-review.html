<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ink Studio · Color review</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color-scheme:dark;background:#12191d;color:#f3e9d6}
*{box-sizing:border-box}
body{margin:auto;max-width:1230px;padding:35px 30px 44px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
h1{font:normal clamp(38px,6vw,72px)/1 Georgia,serif;letter-spacing:-.049em;margin:0}
header p{color:#a7bbba;margin:7px 0 0}
header small{color:#9fb5b8;text-align:right}
main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(254px,1fr);gap:20px}
figure{margin:0;border:1px solid #3e4a4e;border-radius:8px;overflow:hidden;background:#10151a}
.preview{display:grid}
.preview img{display:block;grid-area:1/1;width:100%;image-rendering:pixelated}
.preview img[hidden]{display:none}
figcaption{display:flex;align-items:center;min-height:55px;padding:11px 13px;color:#b7c4c3;gap:12px}
figcaption label{display:flex;align-items:center;gap:9px}
figcaption input{width:clamp(88px,17vw,220px);accent-color:#edbd88}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.controls button{font:inherit;cursor:pointer;background:#202b31;color:#eee5d7;border:1px solid #50616a;border-radius:5px;padding:5px 9px}
.controls button[aria-pressed=true]{background:#edbd88;border-color:#edbd88;color:#261d19}
aside{border-top:1px solid #4c5c61;padding-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 0;text-align:left;border-bottom:1px solid #303e43;vertical-align:top;font-size:.81rem}
th{font-weight:600;color:#afc9cc;padding-right:7px;width:36%}
td{overflow-wrap:anywhere}
h2{font-size:1rem;margin:14px 0 6px}
select{max-width:100%;background:#202b31;color:#eee5d7;border:1px solid #50616a;border-radius:4px;font:inherit;padding:4px 7px}
.swatches{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.swatches span{width:17px;height:17px;border:1px solid #ffffff22;border-radius:2px}
.swatches span[data-empty]{opacity:.35}
footer{display:flex;flex-wrap:wrap;gap:13px;margin-top:16px}
a{color:#edbd88;text-underline-offset:3px}
@media(max-width:710px){body{padding:19px 14px 27px}main{grid-template-columns:1fr}header small{display:none}figcaption{min-height:48px}}
</style>
<header><div><h1 id="title"></h1><p>OCIO color review and palette resolve</p></div><small id="grid"></small></header>
<main>
  <div>
    <figure>
      <div class="preview"><img id="proof" alt="Continuous color proof"><img id="palette" alt="Palette-resolved image"></div>
      <figcaption><label id="splitLabel">Palette split <input id="split" type="range" min="0" max="100" value="50"></label><span id="comparison"></span></figcaption>
    </figure>
    <footer><a id="encoding">Display file</a><a href="working.exr">Working EXR</a><a href="report.json">Color report</a></footer>
  </div>
  <aside>
    <div class="controls" id="views" aria-label="Display views"></div>
    <div class="controls" id="stages" aria-label="Review stages"></div>
    <table><tbody id="pipeline"></tbody></table>
    <h2 id="swatchTitle"></h2><div class="swatches" id="swatches"></div>
    <section id="probes" hidden>
      <h2><label for="probe">Inspect pixel</label></h2><select id="probe"></select>
      <table><tbody id="samples"></tbody></table>
    </section>
  </aside>
</main>
<script>
const report = /*INK_COLOR_REPORT*/;
const byId=id=>document.getElementById(id);
let view=report.views[0], stage='split';
const stages={proof:'Proof',palette:'Palette',split:'Split'};
const pixel=id=>byId(id);
byId('title').textContent=report.label;
byId('grid').textContent=report.grid.width+' × '+report.grid.height+' art grid';
function control(root,label,active,change){
  const button=document.createElement('button');
  button.type='button';button.textContent=label;button.active=active;
  button.addEventListener('click',()=>{change();draw()});root.append(button);
}
function rows(element,items) {
  element.replaceChildren(...items.map(([label,value])=>{
    const row=document.createElement('tr'), name=document.createElement('th'), cell=document.createElement('td');
    name.scope='row';name.textContent=label;cell.textContent=value;
    row.append(name,cell);return row;
  }));
}
for(const entry of report.views) control(byId('views'),entry.label,()=>view===entry,()=>view=entry);
for(const [entry,label] of Object.entries(stages)) control(byId('stages'),label,()=>stage===entry,()=>stage=entry);
for(const [i,p] of view.probes.entries()){
  const option=document.createElement('option');option.value=i;option.textContent=p.label;byId('probe').append(option);
}
byId('probes').hidden=!view.probes.length;
byId('probe').addEventListener('change',draw);
byId('split').addEventListener('input',setSplit);
function setSplit(){
  byId('palette').style.clipPath=stage==='split'?`inset(0 0 0 ${byId('split').value}%)`:'none';
}
function draw(){
  for(const button of document.querySelectorAll('button'))button.setAttribute('aria-pressed',button.active());
  for(const id of ['proof','palette']){
    pixel(id).src=view.files[id];
    pixel(id).hidden=stage!=='split'&&stage!==id;
  }
  byId('splitLabel').hidden=stage!=='split';
  byId('splitLabel').style.display=stage==='split'?'flex':'none';
  byId('comparison').textContent=stage==='split'?'Continuous proof on the left, palette on the right.':
    stage==='proof'?'Continuous SDR proof before palette resolve.':'Fixed Ink swatches on the native grid.';
  byId('encoding').href=view.files.display;
  byId('encoding').textContent=view.display.encoding.startsWith('rec2100-')?'Download HDR PNG':'Download display PNG';
  setSplit();
  rows(byId('pipeline'),[
    ['Source',report.source.space+' · '+report.source.method],
    ['Working',view.working],
    ['Display',view.display.display],
    ['View',view.display.view],
    ['Palette proof',view.proof.view+' · sRGB bytes'],
    ['Clipped components',view.clippedPaletteComponents.toLocaleString()]
  ]);
  byId('swatchTitle').textContent=view.palette.used+' of '+view.palette.slots.length+' swatches used';
  byId('swatches').replaceChildren(...view.palette.slots.map(swatch=>{
    const chip=document.createElement('span');chip.style.background=swatch.color;
    chip.title=swatch.color+' · '+swatch.pixels.toLocaleString()+' pixels';
    if(!swatch.pixels)chip.dataset.empty='';return chip;
  }));
  const p=view.probes[Number(byId('probe').value) || 0];
  if(p) rows(byId('samples'),[
    ['Working RGB',p.working.slice(0,3).map(v=>v.toFixed(3)).join(', ')],
    ['Display RGB16',p.display.slice(0,3).join(', ')],
    ['Proof RGB8',p.proof.slice(0,3).join(', ')],
    ['Palette RGB8',p.palette.slice(0,3).join(', ')]
  ]);
}
draw();
</script>
</html>
