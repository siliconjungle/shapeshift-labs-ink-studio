<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Studio · Clip jam</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#15181c;color:#f0ece4;--muted:#b9c0c6;--line:#46505a;--deck:#202730;--accent:#b9d7fa;--capture:#f9b69a}
*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:34px max(18px,4vw) 45px}
header{border-top:1px solid var(--line);padding:12px 0 20px}header p{margin:0 0 5px;font:700 .74rem ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(2rem,8vw,4.8rem);line-height:1;margin:0;letter-spacing:-.045em;overflow-wrap:anywhere}h2{margin:.45rem 0 .75rem;font-size:1.2rem}
section{border:1px solid var(--line);padding:clamp(14px,3vw,22px);background:#1b2128}
section+section{margin-top:12px}button,select{min-height:39px;padding:6px 11px;border:1px solid #657281;border-radius:4px;background:#28313b;color:inherit;font:inherit;cursor:pointer}
button:disabled,select:disabled{opacity:.54;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{font-weight:700;background:var(--accent);color:#1e2a35}#finish{border-color:var(--capture)}#save{background:var(--accent);color:#1e2a35;font-weight:700}
.row{display:flex;align-items:center;gap:7px 13px;flex-wrap:wrap}.clock{justify-content:space-between}
output{font:13px ui-monospace,monospace;overflow-wrap:anywhere;color:var(--muted)}#cursor{color:var(--accent)}#status{display:block;min-height:1.4em;margin-top:8px}
progress{width:100%;height:12px;accent-color:var(--accent);display:block;margin:12px 0 14px}
label{color:var(--muted);font-size:.83rem}select{margin-left:5px}
#lanes{display:grid;gap:9px}article{border:1px solid var(--line);background:var(--deck);padding:12px;min-width:0}
article h3{margin:0;font-size:1rem;overflow-wrap:anywhere}article header{border:0;padding:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:7px}
.slots{display:flex;gap:6px;flex-wrap:wrap}.slot{padding:7px 11px;text-align:left;overflow-wrap:anywhere;max-width:100%}.slot small{display:block;color:var(--muted);font-size:.72rem}
.slot[aria-pressed=true]{background:var(--accent);color:#1e2a35;border-color:var(--accent)}.slot[aria-pressed=true] small{color:#304354}.slot[data-queued=true]{border-style:dashed;border-color:var(--capture);box-shadow:inset 0 -2px var(--capture)}
.sends{margin-top:10px;display:flex;flex-wrap:wrap;gap:9px 18px}.sends label{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;max-width:100%;overflow-wrap:anywhere}
.sends input{grid-column:1/-1;max-width:100%;width:185px;accent-color:var(--accent)}.mute[aria-pressed=true]{background:var(--capture);color:#3e2117;border-color:var(--capture)}
</style>
<script type="module" src="/jam.mjs"></script>
</head>
<body><main>
<header><p>Ink Studio · Clip jam</p><h1 id="title">Clip jam</h1></header>
<section aria-label="Transport">
<div class="row clock"><div class="row"><button id="play" disabled>Start pass</button><button id="finish" disabled>Finish at bar</button><button id="save" disabled>Save arrangement</button></div><output id="cursor">Opening jam…</output></div>
<progress id="progress" aria-label="Pass position" value="0" max="1"></progress>
<div class="row"><label>Launch on<select id="grid"><option value="beat">Beat</option><option value="bar">Bar</option></select></label><button id="stop-all" disabled>Stop all clips</button></div>
<output id="status" role="status"></output>
</section>
<section aria-labelledby="clips-heading"><h2 id="clips-heading">Clips</h2><div id="lanes"></div></section>
</main></body></html>
