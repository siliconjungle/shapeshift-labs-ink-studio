<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ink Patch Projector</title>
<style>
  html, body { height: 100%; margin: 0; background: black; color: white; font: 15px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  div { position: fixed; inset: auto 1rem 1rem; text-align: center; pointer-events: none; }
  button { cursor: pointer; pointer-events: auto; padding: .6rem 1rem; }
</style>
<canvas id="picture" aria-label="Ink patch output"></canvas>
<div><p id="status" role="status"></p><button id="present" type="button" hidden>Enter full screen</button></div>
<script type="module" src="/patch-projector.mjs"></script>
</html>
