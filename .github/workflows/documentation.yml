name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  public-reference:
    name: Public reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run docs:check
      - name: Reference and rendering regressions
        run: >-
          node --test tests/public-reference.test.js tests/graph-catalog.test.js
          tests/render-compatibility.test.js tests/rebirth-examples.test.js
          tests/additional-light-emitters.test.js tests/color-lut.test.js
          tests/color-space.test.js tests/uv-atlas-slip.test.js
      - name: Browser and headless rendering smoke tests
        run: |
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          INK_TEST_CHROME="$chrome" node --test tests/agent-project.test.js tests/project-bundles.test.js tests/terrain-trails.test.js tests/material-response.test.js tests/effect-pixel.test.js
