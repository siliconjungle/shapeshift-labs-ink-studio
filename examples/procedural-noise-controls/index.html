<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise Workshop · Ink Studio</title>
<style>
  :root{color-scheme:dark;--ink:#eeeaf9;--muted:#b8aecb;--line:#403852;--well:#211c31;--gold:#ffd290;--bg:#151222}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:radial-gradient(ellipse at 80% 0,#26203a 0,transparent 58%),var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
  main{max-width:1300px;margin:auto;padding:25px 33px 30px}
  header{display:flex;justify-content:space-between;align-items:end;gap:15px;padding-bottom:19px;border-bottom:1px solid var(--line);margin-bottom:17px}
  h1,h2,p,figure{margin:0}
  h1{margin-top:4px;font:400 clamp(42px,6vw,80px)/.98 Georgia,serif;letter-spacing:-.06em}
  h2{font-size:15px;font-weight:650}
  .mono{font:11px/1.4 ui-monospace,Menlo,monospace}
  .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.17em}
  .actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  a,button,select{color:inherit;font:inherit;background:var(--well);border:1px solid var(--line);border-radius:4px;padding:7px 11px}
  a{text-decoration:none;color:var(--gold)}
  button,select{cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  a:hover,button:hover,select:hover{border-color:#a895bd}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .view{background:var(--well);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .view.live{border-color:#9f7468}
  figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px}
  figcaption span{color:var(--muted);text-align:right}
  .plate{position:relative;aspect-ratio:2;background:#171328}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  .guides{position:absolute;inset:0;pointer-events:none}
  .guides::before,.guides::after{content:"";position:absolute;mix-blend-mode:screen;opacity:.48}
  .guides::before{left:50%;top:0;bottom:0;border-left:1px dashed #fff0bc}
  .guides::after{top:50%;left:0;right:0;border-top:1px dashed #fff0bc}
  .transport{margin:13px 0 15px;padding:8px 11px;background:#242037;border:1px solid var(--line);border-radius:5px;display:grid;grid-template-columns:103px minmax(40px,1fr) auto auto;gap:12px;align-items:center}
  .transport output{color:var(--gold);min-width:100px;text-align:right}
  .tick{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;cursor:pointer}
  input[type=range]{display:block;width:100%;margin:0;accent-color:var(--gold);cursor:pointer}
  input[type=checkbox]{margin:0;accent-color:var(--gold)}
  .controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  fieldset{margin:0;padding:6px 12px 11px;border:1px solid var(--line);background:var(--well);border-radius:5px;min-width:0}
  legend{color:var(--muted);padding:0 5px}
  .row{display:grid;grid-template-columns:94px minmax(32px,1fr) 54px;align-items:center;gap:7px;min-height:28px}
  .row output{color:var(--gold);text-align:right}
  .note{margin:3px 0 5px;color:var(--muted);font-size:12px}
  fieldset .tick{min-height:28px}
  #error{margin-top:12px;color:#ffb6aa}
  #error:empty{display:none}
  @media(max-width:880px){main{padding-inline:17px}.row{grid-template-columns:77px minmax(28px,1fr) 42px;gap:5px}}
  @media(max-width:650px){
    main{padding:15px 10px}header{align-items:start;flex-direction:column;gap:12px}
    .views,.controls{grid-template-columns:minmax(0,1fr)}.views{gap:9px}.controls{gap:9px}
    .transport{grid-template-columns:92px 1fr auto;gap:8px}.transport .tick{grid-column:1/-1}
    .transport output{min-width:73px}.row{grid-template-columns:92px minmax(28px,1fr) 48px}
  }
</style>
</head>
<body>
<main>
  <header>
    <div><p class="mono eyebrow">Ink Studio / Material graphs</p><h1>Noise Workshop</h1></div>
    <div class="actions">
      <label for="family">Family</label><select id="family"></select>
      <a href="noise-workshop.material.json" download>Download graph</a>
    </div>
  </header>
  <div class="views">
    <figure class="view">
      <figcaption><h2>Reference tile</h2><span class="mono" id="reference-info"></span></figcaption>
      <div class="plate">
        <canvas id="reference" aria-label="Reference noise tile repeated two by two"></canvas>
        <span class="guides" aria-hidden="true"></span>
      </div>
    </figure>
    <figure class="view live">
      <figcaption><h2>Live tile</h2><span class="mono" id="live-info"></span></figcaption>
      <div class="plate">
        <canvas id="live" aria-label="Edited noise tile repeated two by two"></canvas>
        <span class="guides" aria-hidden="true"></span>
      </div>
    </figure>
  </div>
  <div class="transport">
    <button type="button" id="play">Play loop</button>
    <input id="timeline" type="range" min="0" max="2" step=".001" value="0" aria-label="Loop time">
    <output class="mono" id="time-read" for="timeline"></output>
    <label class="tick"><input type="checkbox" id="guides" checked> Seam guides</label>
  </div>
  <div class="controls">
    <fieldset>
      <legend class="mono">Sampling window</legend>
      <label class="row">Scale<input id="scale" type="range" min=".25" max="3" step=".05"><output class="mono"></output></label>
      <label class="row">Tile offset U<input id="u" type="range" min="-.5" max=".5" step=".025"><output class="mono"></output></label>
      <label class="row">Tile offset V<input id="v" type="range" min="-.5" max=".5" step=".025"><output class="mono"></output></label>
      <label class="tick"><input id="expansion" type="checkbox"> Non-square expansion</label>
    </fieldset>
    <fieldset>
      <legend class="mono">Disorder and speed</legend>
      <div id="motion-inputs">
        <label class="row">Disorder<input id="disorder" type="range" min="0" max="1" step=".005"><output class="mono"></output></label>
        <label class="row">Speed<input id="speed" type="range" min="-1" max="1" step=".125"><output class="mono"></output></label>
        <p class="note" id="phase"></p>
      </div>
      <p class="note" id="motion-note" hidden>This family holds its sample values. Move the sampling window to shift the tile.</p>
    </fieldset>
    <fieldset>
      <legend class="mono">Octave bands</legend>
      <div id="band-inputs">
        <label class="row">First octave<input id="first" type="range" min="0" max="7" step="1"><output class="mono"></output></label>
        <label class="row">Last octave<input id="last" type="range" min="0" max="7" step="1"><output class="mono"></output></label>
        <label class="row">Gain<input id="gain" type="range" min="0" max="1" step=".025"><output class="mono"></output></label>
        <label class="row">Lacunarity<input id="lacunarity" type="range" min="1" max="4" step=".05"><output class="mono"></output></label>
      </div>
      <p class="note" id="band-note" hidden>Fractal and Ridged expose octave bands.</p>
    </fieldset>
  </div>
  <p role="alert" id="error"></p>
</main>
<script src="ink-studio.browser.js"></script>
<script src="workshop.js"></script>
<script>
  const get = id => document.getElementById(id), numeric = Object.keys(workshopControls).filter(id=>id!=='expansion');
  const graph = KIT.procedural.graph.create(workshopGraph()), phaseRead = get('phase');
  let recipe, playing = false, time = 0, lastTime = 0, frame = 0, redraw = true, lastReference;
  for (const family of workshopFamilies) get('family').add(new Option(family[0].toUpperCase()+family.slice(1),family));
  get('family').value = workshopFamily;
  for (const id of numeric) get(id).value = workshopControls[id];
  get('expansion').checked = workshopControls.expansion;
  const pretty = n => Number(n.toFixed(3)).toString();
  const current = () => Number(get('timeline').max);
  function configure(changed) {
    if (+get('first').value > +get('last').value) {
      if (changed === 'first') get('last').value = get('first').value;
      else get('first').value = get('last').value;
    }
    const family = get('family').value, previous = recipe;
    const controls = {...Object.fromEntries(numeric.map(id=>[id,get(id).valueAsNumber])),expansion:get('expansion').checked};
    const {reference,live} = workshopRecipe(family,controls);
    recipe = {family,referenceOptions:previous?.family === family ? previous.referenceOptions : reference,liveOptions:live};
    for (const id of numeric) get(id).nextElementSibling.value = pretty(controls[id]) + (id === 'speed' ? ' Hz' : '');
    const motion = workshopMotion(family), stack = workshopStack(family), speed = Math.abs(controls.speed);
    get('motion-inputs').hidden = !motion; get('motion-note').hidden = motion;
    get('band-inputs').hidden = !stack; get('band-note').hidden = stack;
    get('play').disabled = get('timeline').disabled = !motion || !speed;
    if (!motion || !speed) stop();
    get('timeline').max = speed ? 1/speed : 2;
    time = Math.min(time,current());
    redraw = true;
    schedule();
  }
  function tile(name, raster) {
    const canvas = get(name), {width,height,data} = raster;
    if (canvas.width !== width*2 || canvas.height !== height*2) {
      canvas.width = width*2; canvas.height = height*2;
    }
    const ctx = canvas.getContext('2d'), image = new ImageData(new Uint8ClampedArray(data),width,height);
    for (let y=0;y<2;y++) for (let x=0;x<2;x++) ctx.putImageData(image,x*width,y*height);
  }
  function draw(stamp) {
    frame = 0;
    if (playing && stamp-lastTime >= 1000/24) {
      time = (time + (stamp-lastTime)/1000) % current();
      lastTime = stamp; redraw = true;
    }
    if (redraw) {
      redraw = false;
      try {
        const {outputs} = graph.evaluate(recipe,{time});
        if (lastReference !== outputs.reference) tile('reference',outputs.reference);
        lastReference = outputs.reference;
        tile('live',outputs.live);
        for (const name of ['reference','live']) {
          const info = outputs[name+'Info'];
          get(name+'-info').textContent = info.extent.map(pretty).join(' × ') + ' cells · 2 × 2 repeat';
        }
        get('timeline').value = time;
        get('time-read').value = time.toFixed(2)+' / '+current().toFixed(2)+' s';
        phaseRead.textContent = 'Current phase '+pretty(outputs.liveInfo.phase ?? 0)+' of 1';
        get('error').textContent = '';
      } catch (error) { stop(); get('error').textContent = error.message; }
    }
    if (playing) schedule();
  }
  function schedule() { if (!frame) frame = requestAnimationFrame(draw); }
  function stop() { playing = false; get('play').textContent = 'Play loop'; }
  get('play').addEventListener('click',()=>{
    if (playing) stop();
    else { playing = true; lastTime = performance.now(); get('play').textContent='Pause loop'; schedule(); }
  });
  get('timeline').addEventListener('input',()=>{
    stop(); time = get('timeline').valueAsNumber; redraw = true; schedule();
  });
  get('guides').addEventListener('input',()=>{
    for (const guide of document.querySelectorAll('.guides')) guide.hidden = !get('guides').checked;
  });
  for (const id of ['family','expansion',...numeric]) get(id).addEventListener('input',()=>configure(id));
  configure();
</script>
</body>
</html>
