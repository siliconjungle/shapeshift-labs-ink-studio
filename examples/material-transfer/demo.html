<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After the Rain · Ink Studio</title>
<style>
  :root{color-scheme:dark;font:15px/1.45 system-ui,sans-serif;background:#141d20;color:#f2ecda;--muted:#b8c6be;--accent:#ebad79;--line:#3c5152}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0}
  main{max-width:1180px;margin:auto;padding:38px 32px 36px}
  header{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:26px}
  h1{font:400 clamp(42px,7vw,88px)/.91 Georgia,serif;letter-spacing:-.062em;margin:0}
  h2{font-size:15px;font-weight:600;margin:0 0 13px}
  p{margin:0 0 12px}
  button,input,a{font:inherit;color:inherit}
  button,.button{background:#28383a;border:1px solid #4a6060;border-radius:3px;padding:8px 12px;cursor:pointer}
  button:hover,.button:hover,button:focus-visible,.button:focus-visible,input:focus-visible{outline:1px solid var(--accent)}
  button:disabled{opacity:.48;cursor:default}
  input[type=range]{width:100%;accent-color:var(--accent);margin:0}
  label{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .label{font:600 11px/1.35 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
  .product{color:var(--accent);margin-bottom:9px}
  .stage{border:1px solid #536365;background:#162127;overflow:hidden}
  .stage canvas,.stage img{width:100%;height:auto;display:block;image-rendering:pixelated;aspect-ratio:356/128}
  .caption{display:flex;justify-content:space-between;gap:12px;padding-top:9px;margin-bottom:12px}
  .row{display:grid;grid-template-columns:102px minmax(0,1fr) 66px;align-items:center;gap:14px;padding:0 0 17px;border-bottom:1px solid var(--line)}
  output{text-align:right;color:#f1c49e;font-variant-numeric:tabular-nums}
  .panels{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:16px}
  section{border:1px solid var(--line);background:#1d2b2d;padding:16px}
  .steps{display:grid;grid-template-columns:56px repeat(6,minmax(0,1fr));gap:5px;align-items:center;margin:9px 0}
  .steps button{min-width:0;padding:5px 3px;font:600 12px/1.4 ui-monospace,monospace;border-top:3px solid var(--ink);font-variant-numeric:tabular-nums}
  .steps button[data-future=true]{opacity:.63}
  .steps button[aria-current=true]{outline:1px solid var(--accent)}
  .sub{margin-top:13px;color:var(--muted);font-size:13px}
  .amount{display:grid;grid-template-columns:53px 1fr 55px;gap:8px;align-items:center;margin:7px 0;color:var(--muted);font-size:13px}
  meter{width:100%;height:13px}
  meter::-webkit-meter-optimum-value{background:#c4825d}
  .setting{border-top:1px solid var(--line);margin-top:13px;padding-top:10px;font-size:13px}
  .files{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .files a,.files button{text-decoration:none;font-size:12px}
  #message{color:#ffba9c;margin-top:12px}
  #message:empty{display:none}
  @media(max-width:740px){main{padding:24px 16px}.panels{grid-template-columns:1fr}header{align-items:start;flex-direction:column;gap:8px}}
</style>
</head>
<body>
<main>
  <header>
    <div><div class="product label">Ink Studio / Material pickup and transfer</div><h1>After the Rain</h1></div>
    <div class="label">Wet clay → glazed tile</div>
  </header>
  <div class="stage">
    <canvas width="356" height="128" aria-label="Animated mud pickup and tread marks"></canvas>
    <img id="still" alt="Finished trail of fading mud prints on glazed tile" src="data:image/png;base64,@REFERENCE@" hidden>
  </div>
  <div class="caption label"><span id="backend">WebGL2 preview</span><span>356 × 128 native pixels</span></div>
  <div class="row">
    <button id="play" type="button">Play walk</button>
    <input id="time" aria-label="Walk time" type="range" min="0" max="5.6" step=".01" value="5.6">
    <output id="clock" for="time">5.60 s</output>
  </div>
  <div class="panels">
    <section aria-label="Deposit history">
      <h2>Mud left on tile at each step</h2>
      <div id="steps"></div>
      <p class="sub" id="detail" aria-live="polite"></p>
    </section>
    <section aria-label="Mud remaining">
      <h2>Mud carried on each sole</h2>
      <div class="amount"><label for="left">Left</label><meter id="left" min="0" max="1" value="0"></meter><output id="left-amount"></output></div>
      <div class="amount"><label for="right">Right</label><meter id="right" min="0" max="1" value="0"></meter><output id="right-amount"></output></div>
      <div class="setting">
        <label for="fraction">Transfer per loaded step <output id="fraction-value">54%</output></label>
        <input id="fraction" type="range" min="20" max="80" step="1" value="54">
      </div>
      <div class="files">
        <button id="save" type="button">Download scene JSON</button>
        <a class="button" id="reference" download="after-the-rain-headless.png">Original export PNG</a>
      </div>
    </section>
  </div>
  <p id="message" role="status">Loading scene…</p>
</main>
<script>
async function unpack(value) {
  const bytes=Uint8Array.from(atob(value),character=>character.charCodeAt(0));
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function boot() {
  const [toolkitCode,rendererCode,scene]=await Promise.all(['@TOOLKIT@','@RENDERER@','@SCENE@'].map(unpack));
  const toolkit=Function(toolkitCode)(), base=JSON.parse(scene);
  const url=URL.createObjectURL(new Blob([rendererCode],{type:'text/javascript'}));
  let createRenderer;
  try { ({createRenderer}=await import(url)); }
  finally { URL.revokeObjectURL(url); }
  /* DEMO */
}
boot().catch(error=>{ document.getElementById('message').textContent=error.message; });
</script>
</body>
</html>
