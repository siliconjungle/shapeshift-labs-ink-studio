<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silt Lock</title>
<style>
  :root { color-scheme: dark; background: #121922; color: #f6e3b5; font: 1rem system-ui, sans-serif; }
  main { max-width: 61rem; margin: 2rem auto; padding: 0 1rem; }
  canvas { width: 100%; image-rendering: pixelated; background: #17232c; display: block; }
  .controls { margin-top: .75rem; display: flex; align-items: center; gap: .75rem; }
  input[type=range] { flex: 1; min-width: 3rem; }
  input[type=file] { margin-bottom: .75rem; max-width: 100%; }
  output { font-variant-numeric: tabular-nums; }
</style>
<main>
  <h1>Silt Lock</h1>
  <label>Open the Silt Lock project <input type="file" accept=".json,application/json"></label>
  <canvas width="336" height="192" aria-label="Material response preview"></canvas>
  <div class="controls">
    <button type="button" disabled>Play</button>
    <input type="range" aria-label="Scene time" min="0" max="5.8" step="0.01" value="0" disabled>
    <output>0.00 s</output>
  </div>
  <p role="status"></p>
</main>
<script src="../../dist/ink-studio.browser.js"></script>
<script type="module">
  import { createRenderer } from '../../webgl.mjs';
  const canvas = document.querySelector('canvas'), file = document.querySelector('[type=file]');
  const play = document.querySelector('button'), scrub = document.querySelector('[type=range]');
  const output = document.querySelector('output'), status = document.querySelector('[role=status]');
  const renderer = createRenderer(canvas, { toolkit: { KIT, makeBuilder, makeSculpt, PixelLook } });
  let audio, playback, world, running = false, anchor = 0, frame = 0, time = 0, end = 5.8, opening = 0;
  function draw(t) {
    time = t;
    world.anim?.update(0, t);
    renderer.render(world, { time: t });
    scrub.value = t;
    output.value = t.toFixed(2) + ' s';
  }
  function pause() {
    cancelAnimationFrame(frame);
    playback?.stop();
    running = false;
    play.textContent = 'Play';
  }
  function tick() {
    const at = audio.currentTime - anchor;
    if (at >= end) { draw(end); pause(); return; }
    playback.sync();
    draw(at);
    frame = requestAnimationFrame(tick);
  }
  file.addEventListener('change', async () => {
    if (!file.files.length) return;
    const selected = file.files[0], attempt = ++opening;
    pause();
    play.disabled = scrub.disabled = true;
    status.textContent = '';
    try {
      audio ??= new AudioContext();
      const project = KIT.authoring.projectBundles.open(JSON.parse(await selected.text()));
      const next = project.build(), buffers = new Map();
      for (const name of new Set(next.materialResponse.sounds().map(row => row.cue))) {
        const bytes = project.attachment(name).bytes;
        buffers.set(name, await audio.decodeAudioData(Uint8Array.from(bytes).buffer));
      }
      if (attempt !== opening) return;
      world = next;
      playback = world.materialResponse.createPlayback(audio, name => buffers.get(name));
      end = world.timeline?.duration || world.materialResponse.duration;
      scrub.max = end;
      draw(0);
      play.disabled = scrub.disabled = false;
    } catch (error) { if (attempt === opening) status.textContent = error.message; }
  });
  play.addEventListener('click', async () => {
    if (running) { pause(); return; }
    await audio.resume();
    if (time >= end) draw(0);
    playback.seek(time);
    anchor = audio.currentTime - time;
    running = true;
    play.textContent = 'Pause';
    tick();
  });
  scrub.addEventListener('input', () => {
    const t = Number(scrub.value);
    if (running) { playback.seek(t); anchor = audio.currentTime - t; }
    draw(t);
  });
</script>
</html>
