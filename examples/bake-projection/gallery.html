<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vesper Gate · Ink Studio</title>
<style>
:root{color-scheme:dark;font:15px/1.4 system-ui,sans-serif;color:#e6d9c4;background:#101b1d;--line:#355054;--sand:#e4ba83}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1290px;margin:auto;padding:30px clamp(16px,4vw,60px) 20px}
header{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:15px}
h1,h2{font-family:Georgia,serif;font-weight:400;margin:0}
h1{font-size:clamp(52px,9vw,101px);letter-spacing:-.07em;line-height:.94}
h2{font-size:clamp(20px,4vw,27px);line-height:1.12}
p{margin:.5em 0 0;color:#b5c6c4}
a{color:var(--sand);text-underline-offset:3px}
fieldset{border:0;margin:0;padding:16px 0;display:flex;flex-wrap:wrap;gap:6px}
fieldset legend{float:left;margin-right:8px;align-self:center;color:#b5c6c4;font-size:12px}
button,select{color:inherit;font:inherit;border:1px solid #466063;background:#192a2d;border-radius:3px;padding:5px 9px;min-height:32px}
button{cursor:pointer;font-size:12px}
button[aria-pressed=true]{color:#1d2925;background:var(--sand);border-color:var(--sand)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
article{border:1px solid var(--line);background:#172528;padding:12px;min-width:0}
label{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
select{max-width:100%;font-size:13px}
img{display:block;width:min(100%,482px);aspect-ratio:1;margin:10px auto 0;image-rendering:pixelated}
dl{display:flex;flex-wrap:wrap;gap:10px 16px;margin:8px 0 0;font-size:12px;color:#b5c6c4}
dl div{display:flex;gap:5px}dd{margin:0;color:#e6d9c4;font-variant-numeric:tabular-nums}
@media(max-width:660px){.grid{grid-template-columns:1fr}main{padding-top:20px}}
</style>
<script defer src="gallery-data.js"></script>
</head><body><main>
<header><div><h1>Vesper Gate</h1><p>High-to-low bake comparison</p></div><a id="workbench">Bake job and projection settings</a></header>
<fieldset id="channels"><legend>Map</legend></fieldset>
<div class="grid">
<article><label><h2>Left result</h2><select id="left" aria-label="Left projection variant"></select></label><img id="left-image" alt=""><dl id="left-stats"></dl></article>
<article><label><h2>Right result</h2><select id="right" aria-label="Right projection variant"></select></label><img id="right-image" alt=""><dl id="right-stats"></dl></article>
</div>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  const el=id=>document.getElementById(id);
  const channels={pigment:'Pigment',normal:'Tangent normal','cage-hit':'Hits','cage-miss':'Misses',
    'cage-backface':'Backfaces','cage-distance':'Distance','cage-relief':'Signed relief'};
  let map='pigment';
  el('workbench').href=review.revision+'index.html';
  function render() {
    for(const button of el('channels').querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.value===map));
    for(const side of ['left','right']) {
      const row=review.maps.find(entry=>entry.map===map&&entry.target===el(side).value);
      const image=el(side+'-image');
      image.src=review.revision+row.file;
      image.alt=channels[map]+' with '+el(side).selectedOptions[0].text;
      const fields=Object.entries({'Hits':row.hits,'Misses':row.misses,'Backfaces':row.backfaces}).map(([name,value])=>{
        const div=document.createElement('div'), label=document.createElement('dt'), count=document.createElement('dd');
        label.textContent=name;count.textContent=value.toLocaleString();div.append(label,count);return div;
      });
      el(side+'-stats').replaceChildren(...fields);
    }
  }
  for(const [key,label] of Object.entries(channels)) {
    const button=document.createElement('button');
    button.value=key;button.textContent=label;button.onclick=()=>{map=key;render();};
    el('channels').append(button);
  }
  for(const [side,value] of [['left','all'],['right','matched']]){
    el(side).replaceChildren(...review.variants.map(([key,label])=>new Option(label,key)));
    el(side).value=value;el(side).onchange=render;
  }
  render();
});
</script>
</main></body></html>
