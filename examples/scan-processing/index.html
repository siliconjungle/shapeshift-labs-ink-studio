<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Juniper Kiln · Ink Studio</title>
  <style>
    :root{color-scheme:dark;--page:#20201a;--panel:#282b23;--line:#4b4c3c;--text:#f2ebd7;--muted:#c8c4ac;--accent:#e2bb79;--sage:#c1d4a4}
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--text);font:14px/1.45 system-ui,sans-serif}
    main{max-width:1260px;padding:32px clamp(18px,4vw,48px) 38px;margin:auto}
    header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
    h1,h2,p{margin:0}
    h1{font:500 clamp(45px,7vw,76px)/1 Georgia,serif;letter-spacing:-.052em}
    header p{color:var(--muted);margin-top:9px}
    a{color:var(--accent);text-underline-offset:4px}
    .stages{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
    button{font:inherit;color:var(--muted);border-radius:3px;border:1px solid var(--line);background:#292b23;padding:7px 13px;cursor:pointer}
    button[aria-pressed="true"]{color:#faf0cd;border-color:#a88756;background:#4b4733}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 277px;gap:15px;align-items:stretch}
    figure,aside{border:1px solid var(--line);border-radius:4px;background:var(--panel);margin:0;min-width:0}
    figure{overflow:hidden;display:flex;flex-direction:column}
    .stage{display:grid;place-items:center;flex:1;min-height:510px;padding:18px;background:radial-gradient(ellipse at 47% 47%,#484639,#33372b 67%,#292d24)}
    canvas{display:block;width:min(100%,480px);height:auto;image-rendering:pixelated;box-shadow:0 0 0 1px #7e896b55,0 16px 28px #1617129c}
    figcaption{padding:10px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
    aside{padding:0 16px}
    section{padding:15px 0;border-bottom:1px solid var(--line)}
    section:last-child{border:0}
    h2{font-size:14px;font-weight:650}
    section p{color:var(--muted);font-size:12px;margin-top:7px}
    .maps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .maps button{font-size:12px;padding:5px 8px}
    dl{margin:8px 0 0}
    dl div,.check{display:flex;align-items:center;gap:8px;margin-top:7px}
    dl div{justify-content:space-between}
    dt,.check,label{color:var(--muted);font-size:12px}
    dd,output{margin:0;color:var(--sage);font:12px ui-monospace,monospace}
    input{accent-color:#b8c9a0;margin:0}
    input:disabled{opacity:.4}
    input[type=range]{width:100%}
    .range{display:grid;grid-template-columns:40px 1fr 35px;align-items:center;gap:8px;margin-top:8px}
    output{text-align:right}
    @media(max-width:760px){.workspace{grid-template-columns:1fr}.stage{min-height:360px}
      aside{display:grid;grid-template-columns:1fr 1fr;gap:13px}section{border:0}}
    @media(max-width:485px){header{display:block}header a{display:inline-block;margin-top:10px}.stage{min-height:0;padding:12px}
      .stages button{padding:6px 8px;font-size:12px}aside{display:block}section{border-bottom:1px solid var(--line)}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Juniper Kiln</h1><p>A simulated ceramic scan processed into one repeatable material.</p></div>
    <a href="juniper-kiln.material.json" download>Material graph</a>
  </header>
  <nav class="stages" aria-label="Processing stages">
    <button type="button" data-stage="captured" aria-pressed="false">Capture</button>
    <button type="button" data-stage="aligned" aria-pressed="false">Registered</button>
    <button type="button" data-stage="delit" aria-pressed="false">De-lit</button>
    <button type="button" data-stage="repaired" aria-pressed="false">Repaired</button>
    <button type="button" data-stage="value" aria-pressed="true">Tiled</button>
  </nav>
  <div class="workspace">
    <figure>
      <div class="stage"><canvas id="preview" aria-label="Ceramic scan or selected material map"></canvas></div>
      <figcaption id="status" role="status">Loading scan maps</figcaption>
    </figure>
    <aside aria-label="Texture inspection controls">
      <section>
        <h2>View</h2>
        <div class="maps">
          <button type="button" data-map="lit" aria-pressed="true">Relit</button>
          <button type="button" data-map="baseColor" aria-pressed="false">Pigment</button>
          <button type="button" data-map="height" aria-pressed="false">Height</button>
          <button type="button" data-map="normal" aria-pressed="false">Normals</button>
          <button type="button" data-map="roughness" aria-pressed="false">Roughness</button>
          <button type="button" data-map="repairs" aria-pressed="false">Repairs</button>
        </div>
        <div class="range"><label for="light">Light</label><input type="range" id="light" min="0" max="359" value="130">
          <output for="light" id="light-value">130°</output></div>
        <div class="check"><input type="checkbox" id="repeat" checked><label for="repeat">Repeat 2 × 2</label></div>
        <div class="check"><input type="checkbox" id="guides"><label for="guides">Show tile boundaries</label></div>
      </section>
      <section>
        <h2>Processing</h2><p id="stage-note"></p>
        <dl>
          <div><dt>Largest landmark error</dt><dd id="fit"></dd></div>
          <div><dt>Repaired texels</dt><dd id="repair-count"></dd></div>
          <div><dt>Linear pigment RMSE</dt><dd id="light-error"></dd></div>
        </dl>
      </section>
    </aside>
  </div>
</main>
<script src="data.js"></script><script src="live.js"></script>
</body>
</html>
