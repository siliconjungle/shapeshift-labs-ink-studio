<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Transit · Ink Studio</title>
<style>
  :root{color-scheme:dark;--paper:#1a1d2e;--deep:#121522;--rule:#393d56;--white:#f6e8d5;--gold:#eebc81;--muted:#bcc1d0;
    font:15px/1.42 system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at 18% -16%,#35253c,transparent 54%),var(--deep);color:var(--white)}
  main{max-width:1260px;padding:33px 36px;margin:auto}
  header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
  h1{margin:1px 0 3px;font:normal clamp(3rem,7vw,5rem)/1 Georgia,serif;letter-spacing:-.055em}
  p,label,figcaption{margin:0;color:var(--muted)}
  a{color:var(--white);text-underline-offset:5px}
  small{font:.73rem ui-monospace,monospace;letter-spacing:.08em;color:var(--gold)}
  header a{margin-bottom:5px}
  .gallery{display:grid;grid-template-columns:minmax(160px,.58fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
  figure{margin:0;min-width:0;background:var(--paper);border:1px solid var(--rule)}
  .surface{aspect-ratio:232/174;display:grid;place-items:center;background-color:#181d30;
    background-image:linear-gradient(#1f263b 1px,transparent 1px),linear-gradient(90deg,#1f263b 1px,transparent 1px);
    background-size:18px 18px;border-bottom:1px solid var(--rule)}
  .original .surface{aspect-ratio:auto;min-height:calc(100% - 52px);padding:8px}
  canvas{display:block;width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}
  .original canvas{max-width:calc(100% - 20px);height:auto;box-shadow:0 12px 30px #0c1023}
  figcaption{min-height:52px;padding:8px 10px;display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:.82rem}
  figcaption strong{font-weight:620;color:var(--white)}
  .controls{margin-top:12px;display:grid;grid-template-columns:1.4fr 1fr 1.2fr .9fr .9fr 1.15fr;gap:12px;
    align-items:end;padding:12px;background:var(--paper);border:1px solid var(--rule)}
  label{font-size:.8rem;min-width:0}
  select,input{width:100%;margin:4px 0 0;appearance:auto;accent-color:var(--gold)}
  select{padding:6px 7px;background:var(--deep);border:1px solid var(--rule);border-radius:2px;color:var(--white);font:inherit}
  input[type=range]{height:27px;display:block}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .note{font-size:.88rem;min-height:1.5em;margin:12px 0}
  #error{color:#ffb7a8}
  @media(max-width:980px){main{padding:28px 18px}.controls{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:590px){header{display:block} header a{display:inline-block;margin-top:9px}
    .gallery{grid-template-columns:1fr 1fr}.original{grid-column:1/-1;display:flex;align-items:center}
    .original .surface{min-width:126px;min-height:0;border:0;border-right:1px solid var(--rule)}
    .original canvas{width:88px}.original figcaption{flex:1}.surface{aspect-ratio:1}
    figcaption{flex-wrap:wrap;align-content:center}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<main>
  <header>
    <div><small>INK STUDIO · MATERIAL GRAPHS</small><h1>Night Transit</h1>
      <p>Compare two ways of sampling the same enamel and brass tile.</p></div>
    <a href="night-transit.material.json" download>Editable material graph</a>
  </header>
  <div class="gallery">
    <figure class="original">
      <div class="surface"><canvas id="source" aria-label="Source tile with a teal and brass medallion"></canvas></div>
      <figcaption><strong>Source tile</strong><small>160 × 160</small></figcaption>
    </figure>
    <figure>
      <div class="surface"><canvas id="base" aria-label="Transformed tile sampled from level zero"></canvas></div>
      <figcaption><strong>Level zero</strong><small id="base-label"></small></figcaption>
    </figure>
    <figure>
      <div class="surface"><canvas id="filtered" aria-label="Transformed tile sampled with the selected mip policy"></canvas></div>
      <figcaption><strong id="result-label">Automatic mip filtering</strong><small id="mip-label"></small></figcaption>
    </figure>
  </div>
  <div class="controls">
    <label>Transform <select id="mode"></select></label>
    <label>Texel filter <select id="filter"><option value="linear">Bilinear</option><option value="nearest">Nearest</option></select></label>
    <label>Mip level <select id="mip"><option value="linear">Auto · blend</option><option value="nearest">Auto · nearest</option>
      <option value="0">Level 0</option><option value="1">Level 1</option><option value="2">Level 2</option>
      <option value="3">Level 3</option><option value="4">Level 4</option></select></label>
    <label>U addressing <select id="u"></select></label>
    <label>V addressing <select id="v"></select></label>
    <label><span id="adjust-label">Foreshortening</span> <input id="position" type="range" min="0" max="1" step=".01" value=".65"></label>
  </div>
  <p id="note" class="note"></p>
  <p id="error" role="status"></p>
</main>
<script src="ink-studio.browser.js"></script>
<script src="transit.js"></script>
<script>
  const get = id => document.getElementById(id);
  const plate = transitPlate(), graphs = new Map();
  const labels = {
    perspective: ['Far edge width', 'Compare the narrow far edge with the near edge. Automatic mip filtering uses a different level at each depth.'],
    transform: ['Rotation', 'Try Wrap and Mirror to compare how the rotated copies meet.'],
    crop: ['Crop position', 'The crop extends past the source on the left. Try Transparent on U to see the source boundary.'],
    symmetry: ['Fold position', 'The left side is folded across a moving vertical axis.'],
    toPolar: ['Start angle', 'The center maps to the top of the strip. Distance increases downward and angle increases to the right.'],
    fromPolar: ['Start angle', 'The source wraps around the center. The first and last source columns meet along the radial seam.']
  };
  for (const [name,label] of Object.entries(transitModes)) get('mode').add(new Option(label,name));
  for (const control of ['u','v']) for (const name of ['wrap','clamp','mirror','transparent'])
    get(control).add(new Option(name[0].toUpperCase() + name.slice(1),name));
  get('v').value = 'clamp';

  function paint(canvas, raster) {
    canvas.width = raster.width;
    canvas.height = raster.height;
    canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(raster.data),raster.width,raster.height),0,0);
  }

  function render() {
    try {
      const mode = get('mode').value, filter = get('filter').value, choice = get('mip').value;
      const mip = Number.isNaN(Number(choice)) ? choice : Number(choice);
      const options = transitOptions(mode, { position:Number(get('position').value), filter, mip,
        u:get('u').value, v:get('v').value });
      if (!graphs.has(mode)) graphs.set(mode, KIT.procedural.graph.create(transitGraph([mode])));
      const base = mode + 'Base', filtered = mode + 'Filtered';
      const {outputs} = graphs.get(mode).evaluate({plate,[base]:options.base,[filtered]:options.filtered});
      paint(get('source'),outputs.source);
      paint(get('base'),outputs[base]);
      paint(get('filtered'),outputs[filtered]);
      get('base-label').textContent = filter === 'linear' ? 'BILINEAR' : 'NEAREST';
      get('mip-label').textContent = typeof mip === 'number' ? 'LEVEL ' + mip : mip === 'linear' ? 'BLENDED' : 'NEAREST LEVEL';
      get('result-label').textContent = typeof mip === 'number' ? 'Fixed mip level' : 'Automatic mip filtering';
      get('adjust-label').textContent = labels[mode][0];
      get('note').textContent = labels[mode][1];
      get('error').textContent = '';
    } catch (error) { get('error').textContent = error.message; }
  }

  let pending = false;
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; render(); });
  }
  for (const id of ['mode','filter','mip','u','v','position']) get(id).addEventListener('input',schedule);
  render();
</script>
</html>
