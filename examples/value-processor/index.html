<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian · Ink Studio</title>
<style>
:root{color-scheme:dark;--bg:#151823;--panel:#202331;--edge:#484354;--paper:#f5e6d3;--muted:#c1bdc8;--sand:#ecc49e;--mint:#acd9cc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--paper);background:radial-gradient(ellipse at 28% -15%,#3b3b53,transparent 59%),var(--bg);font:14px system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:clamp(22px,3.6vw,48px) clamp(16px,3.6vw,42px) 25px}
header{margin-bottom:19px}
h1,h2,p{margin:0}
h1{font:400 clamp(58px,7vw,86px)/.95 Georgia,serif;letter-spacing:-.067em;margin:4px 0 9px}
h2{font:400 22px/1.12 Georgia,serif;letter-spacing:-.031em}
p{color:var(--muted);line-height:1.47}
.label,output,.receipt{font:11px ui-monospace,monospace;letter-spacing:.065em}
.label{text-transform:uppercase;color:var(--sand)}.receipt,output{color:var(--mint)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(278px,346px);gap:13px;align-items:start}
figure,aside,details{border:1px solid var(--edge);border-radius:9px;background:var(--panel);margin:0;overflow:hidden}
.canvas{display:grid;justify-items:center;min-height:140px;background:#121925}
canvas{display:block;width:100%;max-width:652px;height:auto;image-rendering:pixelated;cursor:crosshair}
figcaption{padding:10px 13px;border-top:1px solid var(--edge);display:flex;gap:10px;align-items:center;justify-content:space-between}
figcaption span{text-align:right}
aside{padding:14px}
aside section+section{margin-top:14px;padding-top:13px;border-top:1px solid var(--edge)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 11px;margin-top:10px}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 4px;min-width:0}
.field label,.results dt{color:var(--muted);font-size:11px}
.field input{grid-column:1/-1;width:100%;min-width:0;margin:0}
button,input,textarea{font:inherit;accent-color:var(--sand)}
button{color:var(--paper);background:#313343;border:1px solid #685b6e;border-radius:5px;cursor:pointer;padding:5px 8px}
button:hover{border-color:var(--sand)}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.results{display:grid;gap:8px;margin:11px 0 0}.results div{display:flex;justify-content:space-between;gap:6px}
.results dd{margin:0;text-align:right}
#state[data-aligned=false]{color:var(--sand)}
.score{height:5px;background:#171e2a;border-radius:3px;overflow:hidden;margin:10px 0 1px}.score span{display:block;height:100%;background:var(--mint);width:0}
.actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--edge)}
.actions a,.actions button{font-size:11px}
a{color:var(--sand);text-underline-offset:3px}
#save{margin-left:auto;color:#25222a;background:var(--sand);border-color:var(--sand);font-weight:650}
details{margin-top:12px;padding:10px 12px}
summary{cursor:pointer}
textarea{display:block;width:100%;min-height:246px;margin:9px 0;padding:8px;background:#161a24;color:var(--mint);border:1px solid var(--edge);font:12px/1.44 ui-monospace,monospace;resize:vertical}
.error{color:#ffb39f;font-size:11px;white-space:pre-wrap;margin-top:7px}.error:empty{display:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}header{margin-bottom:13px}main{padding-top:20px}}
</style>
</head>
<body>
<main>
<header>
  <span class="label">Ink Studio · Value Processor</span>
  <h1>Meridian</h1>
  <p>One formula sets the native pixel grid, measures alignment, and places the compass markers.</p>
</header>
<div class="layout">
  <figure>
    <div class="canvas"><canvas id="dial" width="144" height="128" aria-label="Meridian compass. Click the dial to set the heading."></canvas></div>
    <figcaption><h2>Survey compass</h2><span class="label">Click to set heading</span></figcaption>
  </figure>
  <aside aria-label="Formula settings and output values">
    <section><h2>Survey settings</h2><div class="fields" id="controls"></div></section>
    <section>
      <h2>Processor outputs</h2>
      <dl class="results">
        <div><dt>Native dimensions</dt><dd class="receipt" id="extent"></dd></div>
        <div><dt>Alignment score</dt><dd class="receipt" id="score"></dd></div>
        <div><dt>Target range</dt><dd class="receipt" id="range"></dd></div>
        <div><dt>Heading vector</dt><dd class="receipt" id="vector"></dd></div>
        <div><dt>Target status</dt><dd class="receipt" id="state" aria-live="polite"></dd></div>
      </dl>
      <div class="score" aria-hidden="true"><span id="level"></span></div>
      <p class="error" id="error" role="alert"></p>
    </section>
    <div class="actions">
      <a href="meridian.material.json" download>Original material</a>
      <button type="button" id="reset">Reset</button>
      <button type="button" id="save">Save material</button>
    </div>
  </aside>
</div>
<details>
  <summary>Edit formula</summary>
  <textarea id="program" aria-label="Value Processor JSON formula" spellcheck="false"></textarea>
  <button type="button" id="apply">Apply formula</button>
  <p class="error" id="codeError" role="alert"></p>
</details>
</main>
<script src="ink-studio.browser.js"></script>
<script src="data.js"></script>
<script src="live.js"></script>
</body>
</html>
