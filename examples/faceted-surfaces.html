<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    A Study in Planes · Ink Studio
  </title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #07131d;
      color: #c6ddcd;
      font: 14px system-ui;
      margin: 0;
    }
    main {
      max-width: 1280px;
      margin: auto;
      padding: 30px;
    }
    header {
      font: 10px monospace;
      letter-spacing: 3px;
      color: #77a59c;
      border-bottom: 1px solid #28434b;
      padding-bottom: 18px;
    }
    h1 {
      font: 44px Georgia;
      margin: 25px 0 8px;
      color: #f1cc8a;
    }
    p {
      color: #88aba8;
      font-size: 13px;
      line-height: 1.7;
    }
    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 12px;
    }
    button {
      background: #102b35;
      border: 1px solid #355a60;
      color: #c9e4cf;
      padding: 10px 16px;
      cursor: pointer;
      font: 11px monospace;
    }
    button.active {
      border-color: #d1a767;
      color: #ffd99a;
    }
    canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      touch-action: none;
      background: #071b27;
      border: 1px solid #28434b;
    }
    footer {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: space-between;
      color: #69928f;
      font: 11px monospace;
      margin-top: 15px;
    }
    .hint {
      margin-left: auto;
      align-self: center;
      color: #77a59c;
      font: 10px monospace;
    }
  </style>
  <main>
    <header>INK STUDIO / REPRESENTATIONS 09</header>
    <h1>A Study in Planes</h1>
    <p>Sculpted with signed distance. Reconstructed as crisp planes. Flat light, grouped colour, living details.</p>
    <nav>
      <button data-view="quarry" class="active">01 / Amethyst quarry</button
      ><button data-view="foundry">02 / Copperworks</button><span class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</span>
    </nav>
    <canvas id="view" width="1200" height="720"></canvas>
    <nav>
      <button id="representation">Smooth rocks / walls</button><button id="grain">Turn facet grain</button
      ><button id="size">Finer facets</button><button id="grouping">Group by position</button
      ><button id="pause">Pause</button>
    </nav>
    <footer>
      <span id="status">Tracing the fields…</span><span>SDF GEOMETRY / NATIVE PATCHES / PER-OBJECT CONTROLS</span>
    </footer>
  </main>
  <script src="../dist/ink-studio.browser.js"></script>
  <script src="./faceted-surfaces.js"></script>
  <script type="module">
    import { createRenderer } from '../webgl.mjs';
    const kit = {
        KIT,
        makeBuilder,
        makeSculpt,
        PixelLook,
        SpriteSurface,
        TexturedSurface,
        RenderStages,
        TargetSelectors,
        SplatProvenance
      },
      demo = facetedSurfacesDemo(kit),
      canvas = document.querySelector('#view'),
      renderer = createRenderer(canvas, { toolkit: kit });
    demo.state.view = 'quarry';
    const refresh = () =>
      document
        .querySelectorAll('[data-view]')
        .forEach(b => b.classList.toggle('active', demo.state.view === b.dataset.view));
    document.querySelectorAll('[data-view]').forEach(
      b =>
        (b.onclick = () => {
          demo.state.view = b.dataset.view;
          refresh();
        })
    );
    for (const id of ['representation', 'size', 'grouping', 'grain'])
      document.querySelector('#' + id).onclick = e => {
        if (id === 'representation') {
          demo.state.faceted = !demo.state.faceted;
          e.target.textContent = demo.state.faceted ? 'Smooth rocks / walls' : 'Faceted rocks / walls';
        }
        if (id === 'size') {
          demo.state.size = demo.state.size > 0.3 ? 0.22 : 0.36;
          e.target.textContent = demo.state.size > 0.3 ? 'Finer facets' : 'Larger facets';
        }
        if (id === 'grouping') {
          demo.state.grouping = demo.state.grouping === 'normal' ? 'spatial' : 'normal';
          e.target.textContent = demo.state.grouping === 'normal' ? 'Group by position' : 'Group by normal';
        }
        if (id === 'grain') demo.state.grain += 0.24;
        demo.rebuild();
      };
    document.querySelector('#pause').onclick = e => {
      demo.state.paused = !demo.state.paused;
      e.target.textContent = demo.state.paused ? 'Resume' : 'Pause';
    };
    let drag,
      last,
      stamp,
      frames = 0,
      fps = 60;
    canvas.onpointerdown = e => {
      drag = [e.clientX, e.clientY, demo.camera.yaw, demo.camera.pitch];
      canvas.setPointerCapture(e.pointerId);
    };
    canvas.onpointermove = e => {
      if (drag) {
        demo.camera.yaw = drag[2] - (e.clientX - drag[0]) * 0.005;
        demo.camera.pitch = Math.max(-0.6, Math.min(1.4, drag[3] + (e.clientY - drag[1]) * 0.005));
      }
    };
    canvas.onpointerup = canvas.onpointercancel = () => (drag = null);
    canvas.addEventListener(
      'wheel',
      e => {
        e.preventDefault();
        demo.camera.dist = Math.max(3, Math.min(24, demo.camera.dist * Math.exp(e.deltaY * 0.001)));
      },
      { passive: false }
    );
    refresh();
    window.facetQA = { demo, renderer, kit };
    function tick(t) {
      const dt = last === undefined ? 0 : Math.min(0.05, (t - last) / 1000);
      last = t;
      demo.update(dt);
      renderer.render(demo.world, {
        time: demo.state.time,
        camera: demo.camera,
        changedRows: [],
        width: 1200,
        height: 720,
        damp: false,
        stepAnimation: false,
        raw: true
      });
      stamp ??= t;
      frames++;
      if (t - stamp > 800) {
        fps = Math.round((frames * 1000) / (t - stamp));
        frames = 0;
        stamp = t;
      }
      document.querySelector('#status').textContent = `${demo.world.count.toLocaleString()} native splats / ${fps} fps`;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</html>
