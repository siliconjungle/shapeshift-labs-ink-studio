<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saltwind Courier · Ink Studio</title>
<style>
:root{color-scheme:dark;background:#111c27;color:#ece1ca;font:15px system-ui,sans-serif;--line:#3e5461;--muted:#acbac0;--accent:#edb58d}
body{margin:0}
main{max-width:1010px;margin:0 auto;padding:clamp(24px,6vw,66px) clamp(14px,5vw,58px)}
header{margin-bottom:24px}
h1{font-size:clamp(36px,8vw,79px);line-height:.95;margin:0 0 12px;letter-spacing:-.07em}
p{color:var(--muted);margin:0;max-width:61ch}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
figure{border:1px solid var(--line);margin:0;background:#162532;border-radius:6px;overflow:hidden}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;background:#12212d}
#painted{touch-action:none;cursor:crosshair}
figcaption{padding:11px 13px;border-top:1px solid var(--line);font-weight:650}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0 0}
.control,.brush{display:grid;align-items:center;gap:10px;grid-template-columns:65px minmax(60px,1fr) 4ch}
.brush{grid-template-columns:auto minmax(100px,1fr) auto}
output{color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}
input{width:100%;accent-color:var(--accent);margin:0}
button,select{font:inherit;padding:7px 11px;border:1px solid #637888;border-radius:4px;background:#223949;color:inherit;cursor:pointer}
#play{color:#16252e;background:var(--accent);border-color:var(--accent);font-weight:650;justify-self:start}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:580px){.views{gap:7px}figcaption{padding:8px;font-size:12px}.controls{grid-template-columns:1fr;gap:11px}button,select{font-size:14px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Saltwind Courier</h1>
    <p>Move the light to compare the cheek and cloak. Drag on the right to paint the direction those areas face for diffuse lighting.</p>
  </header>
  <div class="views">
    <figure><canvas id="sculpt" width="168" height="160" aria-label="Courier lit with sculpted normals"></canvas><figcaption>Sculpted normals</figcaption></figure>
    <figure><canvas id="painted" width="168" height="160" aria-label="Courier with paintable shading normals"></canvas><figcaption>Painted shade normals</figcaption></figure>
  </div>
  <div class="controls">
    <label class="control" for="light">Light <input id="light" type="range" min="-65" max="65" value="37"><output id="light-value" for="light">37°</output></label>
    <label class="control" for="orbit">View <input id="orbit" type="range" min="-35" max="35" value="-3"><output id="orbit-value" for="orbit">−3°</output></label>
    <button type="button" id="play" aria-pressed="false">Play light</button>
    <div class="brush">
      <label for="brush">Brush</label>
      <select id="brush"><option value="left">Tilt left</option><option value="right">Tilt right</option><option value="erase">Erase tilt</option></select>
      <button type="button" id="reset">Reset strokes</button>
    </div>
  </div>
</main>
<script src="../../dist/ink-studio.browser.js"></script>
<script type="module" src="demo.mjs"></script>
</body>
</html>
