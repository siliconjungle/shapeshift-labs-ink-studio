<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Study · Ink Studio</title>
<style>
  :root { color-scheme:dark; --text:#f2eadc; --muted:#b6c5cb; --line:#3d4e59; --accent:#f1bb83;
    --panel:#1d2934; font:16px/1.45 system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--text); background:radial-gradient(ellipse at 22% -50%,#3b515f,#111b25 62%); }
  main { max-width:1210px; margin:auto; padding:39px 35px; }
  header { margin-bottom:22px; }
  h1 { margin:5px 0 7px; font:normal clamp(3rem,8vw,5.3rem)/.93 Georgia,serif; letter-spacing:-.05em; }
  header p, figcaption, label, .bounds { color:var(--muted); }
  p { margin:0; }
  small, .kicker { color:var(--accent); letter-spacing:.10em; font:600 .73rem ui-monospace,monospace; text-transform:uppercase; }
  .layout { display:grid; grid-template-columns:minmax(0,2.5fr) minmax(275px,1fr); gap:16px; align-items:start; }
  .plates { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  figure, aside { margin:0; background:var(--panel); border:1px solid var(--line); }
  figcaption { display:flex; gap:6px; justify-content:space-between; font-size:.82rem; padding:8px 10px; border-top:1px solid var(--line); }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; background:#121c28; }
  canvas.hist { height:105px; background:#182330; border-top:1px solid var(--line); }
  aside { padding:18px; }
  h2 { margin:0 0 11px; font:normal 1.6rem Georgia,serif; }
  label { display:block; font-size:.86rem; margin-bottom:10px; }
  select, textarea { display:block; width:100%; color:var(--text); background:#141f2a; border:1px solid var(--line);
    font:inherit; padding:7px 9px; margin-top:3px; border-radius:2px; }
  textarea { font:.84rem/1.5 ui-monospace,monospace; min-height:112px; resize:vertical; }
  button { color:#14202b; background:var(--accent); border:0; border-radius:2px; padding:7px 13px; font:600 .86rem system-ui,sans-serif; cursor:pointer; }
  a { color:var(--text); text-underline-offset:4px; }
  .links { display:flex; flex-wrap:wrap; gap:7px 13px; justify-content:space-between; align-items:center; }
  .bounds { margin-top:13px; padding-top:12px; border-top:1px solid var(--line); font-size:.82rem; }
  .bounds span { display:block; margin-top:4px; white-space:pre-wrap; font-family:ui-monospace,monospace; }
  [role=status] { color:#ffb993; font-size:.84rem; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media(max-width:780px) { main { padding:24px 14px; } .layout { grid-template-columns:1fr; } }
  @media(max-width:420px) { canvas.hist { height:62px; } figcaption { display:block; } }
</style>
<main>
  <header>
    <div class="kicker">Ink Studio · Material graphs</div>
    <h1>Prism Study</h1>
    <p>Grade a 16-bit enamel plate and see how the sample distribution changes.</p>
  </header>
  <div class="layout">
    <section class="plates" aria-label="Before and after">
      <figure>
        <canvas id="before" width="144" height="96" aria-label="Original enamel plate"></canvas>
        <figcaption><span>Original plate</span><span>UNORM16 RGB</span></figcaption>
        <canvas class="hist" id="before-hist" width="288" height="105" aria-label="Original histogram"></canvas>
        <figcaption><span>Linear luminance</span><span id="before-range"></span></figcaption>
      </figure>
      <figure>
        <canvas id="after" width="144" height="96" aria-label="Corrected enamel plate"></canvas>
        <figcaption><span id="effect-label">Corrected plate</span><span id="result-format"></span></figcaption>
        <canvas class="hist" id="after-hist" width="288" height="105" aria-label="Corrected histogram"></canvas>
        <figcaption><span id="hist-label">Linear luminance</span><span id="after-range"></span></figcaption>
      </figure>
    </section>
    <aside>
      <h2>Correction</h2>
      <form id="controls">
        <label>Operation <select id="preset"></select></label>
        <label>Node options <textarea id="settings" rows="7" spellcheck="false"></textarea></label>
        <div class="links"><button type="submit">Apply options</button><a id="material" href="prism-study.material.json">Editable preset</a></div>
      </form>
      <div class="bounds"><small>Measured result</small><span id="measured"></span></div>
      <p id="error" role="status"></p>
    </aside>
  </div>
</main>
<script src="ink-studio.browser.js"></script>
<script src="prism.js"></script>
<script>
  const get = id => document.getElementById(id);
  const plate = prismPlate();
  const graphs = new Map();
  for (const [key, {label}] of Object.entries(paintPresets)) get('preset').add(new Option(label,key));
  const number = value => value === null ? '—' : Number(value.toFixed(4));
  function paint(id, raster, maximum) {
    const {width,height,channels,data} = raster;
    const rgba = new Uint8ClampedArray(width * height * 4);
    for (let i = 0, p = 0; i < data.length; i += channels, p += 4) {
      for (let c = 0; c < 3; c++) rgba[p+c] = data[i + (channels === 1 ? 0 : c)] / maximum * 255;
      rgba[p+3] = channels === 4 ? data[i+3] / maximum * 255 : 255;
    }
    get(id).getContext('2d').putImageData(new ImageData(rgba,width,height),0,0);
  }
  function plot(prefix, report, color, ceiling) {
    const canvas = get(prefix + '-hist'), {width,height} = canvas;
    const context = canvas.getContext('2d');
    context.clearRect(0,0,width,height);
    context.strokeStyle = '#324655';
    for (let row = 20; row < height; row += 22) {
      context.beginPath(); context.moveTo(0,row); context.lineTo(width,row); context.stroke();
    }
    context.fillStyle = color;
    const step = width / report.counts.length;
    report.counts.forEach((count,i) => {
      const size = Math.round((height - 10) * (count / ceiling) ** .52);
      context.fillRect(Math.floor(i * step), height - size, Math.max(1,Math.floor(step)-1), size);
    });
    get(prefix + '-range').textContent = number(report.min) + ' – ' + number(report.max);
  }
  function render() {
    try {
      const mode = get('preset').value, settings = JSON.parse(get('settings').value);
      if (!graphs.has(mode)) graphs.set(mode,KIT.procedural.graph.create(prismGraph(mode)));
      const {outputs} = graphs.get(mode).evaluate({plate,settings});
      const {corrected,beforeBins,afterBins,afterDisplay,fitted} = outputs;
      const precision = corrected.descriptor.precision;
      const scale = {unorm8:255,unorm16:65535}[precision] ?? 1;
      paint('before',outputs.beforeDisplay,255);
      paint('after',afterDisplay ?? corrected.raster,afterDisplay ? 255 : scale);
      const ceiling = Math.max(1,...beforeBins.counts,...afterBins.counts);
      plot('before',beforeBins,'#73acce',ceiling);
      plot('after',afterBins,'#f1b982',ceiling);
      get('effect-label').textContent = paintPresets[mode].label;
      get('result-format').textContent = precision.toUpperCase() + ' ' + (afterDisplay ? 'RGB' : 'mask');
      get('hist-label').textContent = afterDisplay ? 'Linear luminance' : 'Mask coverage';
      get('measured').textContent = fitted ?
        'Fit ' + (fitted.bounds?.map(number).join(' → ') ?? 'empty') + ' across ' + fitted.count.toLocaleString() + ' samples' :
        afterBins.count.toLocaleString() + ' texels · Below ' + afterBins.below + ' · Above ' + afterBins.above;
      get('error').textContent = '';
    } catch (error) {
      get('error').textContent = error.message;
    }
  }
  function selectPreset() {
    const mode = get('preset').value;
    get('settings').value = JSON.stringify(paintPresets[mode].settings,null,2);
    get('material').href = mode === 'levels' ? 'prism-study.material.json' : 'presets/' + mode + '.material.json';
    render();
  }
  get('preset').addEventListener('change',selectPreset);
  get('controls').addEventListener('submit',event=>{event.preventDefault();render();});
  selectPreset();
</script>
</html>
