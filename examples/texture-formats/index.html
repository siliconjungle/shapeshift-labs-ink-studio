<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glaze Archive · Ink Studio</title>
<style>
:root{color-scheme:dark;--ground:#10171c;--stage:#1b292f;--panel:#151d22;--line:#304047;--white:#f7e9d5;--muted:#b2bfc0;--gold:#efbd7f;--green:#a0d1c2}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--white);font:15px/1.5 system-ui,sans-serif}
main{max-width:1320px;margin:auto;padding:44px 42px 28px}
header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}
h1{font:normal clamp(52px,7.4vw,104px)/.92 Georgia,serif;letter-spacing:-.068em;margin:8px 0 0}
h2{font:normal 29px/1.1 Georgia,serif;margin:0 0 4px}
p{margin:0;color:var(--muted)}
.brand,.label,.size,button,dt,select,.source{font:600 11px/1.3 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase}
.brand{color:var(--gold);letter-spacing:.17em}
.source,.download{color:var(--white);text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:11px 14px;width:max-content}
.source:hover,.download:hover,button:hover{border-color:var(--gold)}a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:10px 15px;cursor:pointer}
button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ground)}
.layout{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(285px,1fr);gap:12px;align-items:start}
figure{margin:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stage{min-height:470px;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 49% 42%,#2b4147,var(--stage) 72%);border-bottom:1px solid var(--line)}
.stage img{max-width:100%;width:568px;height:auto;image-rendering:pixelated;filter:drop-shadow(3px 9px 8px #13171991)}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:var(--panel)}
.size{color:var(--muted);white-space:nowrap}
aside{min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:22px}
.select{display:flex;flex-direction:column;gap:8px;margin:0 0 20px;color:var(--muted)}
select{width:100%;background:var(--ground);color:var(--white);padding:12px;border:1px solid var(--line);border-radius:3px;text-transform:none;letter-spacing:.03em}
dl{display:grid;grid-template-columns:1fr 1fr;margin:18px 0;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
dl div{padding:10px 11px;background:var(--panel)}dt{color:var(--muted);margin-bottom:4px}
dd{margin:0;overflow-wrap:anywhere}ul{padding-left:17px;margin:6px 0 14px;overflow-wrap:anywhere}
li::marker{color:var(--gold)}
.sample{color:var(--green);font:500 12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}
.download{display:inline-block;margin-top:17px;border-color:#785f48;color:var(--gold);font-weight:600;max-width:100%;overflow-wrap:anywhere}
footer{margin-top:17px;color:var(--muted);font-size:13px}
@media(max-width:780px){main{padding:28px 18px}header{align-items:start;flex-direction:column;gap:14px}.layout{grid-template-columns:1fr}.stage{min-height:0}aside{padding:18px}}
@media(max-width:410px){button{padding:9px 11px}h1{font-size:54px}}
</style>
<script defer src="data.js"></script>
<script defer src="live.js"></script>
</head>
<body>
<main>
  <header>
    <div><div class="brand">Ink Studio · Texture delivery</div><h1>Glaze Archive</h1></div>
    <a class="source" href="glaze-archive.material.json" download>Download editable material ↓</a>
  </header>
  <nav id="formats" aria-label="Texture format"></nav>
  <div class="layout">
    <figure>
      <div class="stage"><img id="texture" alt="Decoded texture"></div>
      <figcaption><span id="caption"></span><span class="size" id="extent"></span></figcaption>
    </figure>
    <aside aria-label="Reopened file details">
      <label class="select"><span class="label">View</span><select id="view"></select></label>
      <div aria-live="polite"><h2 id="title"></h2><p id="detail"></p>
        <dl>
          <div><dt>Precision</dt><dd id="precision"></dd></div><div><dt>Alpha</dt><dd id="alpha"></dd></div>
          <div><dt>Color metadata</dt><dd id="profile"></dd></div><div><dt>File size</dt><dd id="bytes"></dd></div>
        </dl>
        <div id="inventory"></div>
        <div class="label" id="probe"></div><div class="sample" id="sample"></div>
      </div>
      <a id="download" class="download" download></a>
    </aside>
  </div>
  <footer>Each preview and sample was decoded from its downloadable file.</footer>
</main>
</body>
</html>
