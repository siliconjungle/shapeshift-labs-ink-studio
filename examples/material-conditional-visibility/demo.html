<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal lens · Ink Studio</title>
<style>
:root{color-scheme:dark;--ink:#f1e6ce;--muted:#abbab2;--panel:#20302e;--line:#46564c;--gold:#efbf80;--aqua:#afd1bf;--warm:#f2b186}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 0,#314940,transparent 700px),#172320;color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{width:min(100% - 56px,1080px);margin:auto;padding:34px 0 26px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:21px}
header small{color:var(--gold);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.15em}
h1{font:500 clamp(42px,7vw,72px)/1 Georgia,serif;letter-spacing:-.055em;margin:4px 0 0}
header p{max-width:300px;color:var(--muted);margin:0 0 2px}
.layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(320px,1fr);gap:15px;align-items:start}
.preview,aside{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;min-width:0}
.preview h2,aside h2{margin:0 0 7px;font-size:15px;font-weight:650}
figure{margin:0}figure img{display:block;width:min(100%,400px);aspect-ratio:5/4;margin:auto;object-fit:contain;image-rendering:pixelated}
figcaption{margin:9px 4px 0;display:flex;justify-content:space-between;gap:10px}figcaption small{color:var(--muted)}
nav{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;gap:6px;flex-wrap:wrap}
nav button,.repair{padding:5px 9px;border:1px solid #607365;background:#304137;border-radius:5px;font:inherit;font-size:13px;color:inherit;cursor:pointer}
nav button[aria-pressed=true]{border-color:#c5aa76;background:#4c4932;color:#f8dfae}
.row{display:grid;grid-template-columns:116px minmax(0,1fr) 46px;gap:8px;min-height:42px;align-items:center;border-bottom:1px solid #394a43}
.row label{font-weight:600;overflow-wrap:anywhere}.row select{grid-column:2/4;max-width:216px;width:100%;font:inherit;color:inherit;background:#293d35;border:1px solid #5f7468;border-radius:4px;padding:3px 6px}
.row input{accent-color:#b4c9a3;min-width:0}.row input[type=checkbox]{justify-self:start;margin-left:0}
output{color:var(--aqua);font:13px ui-monospace,monospace;text-align:right}
.state{margin:12px 0 5px;color:var(--muted);font-size:13px}
.diagnostic{border:1px solid #805d47;background:#382f28;border-radius:6px;padding:10px;margin-top:11px}
.diagnostic h3{margin:0;color:var(--warm);font-size:13px}.diagnostic p{margin:6px 0}.diagnostic code{font:12px ui-monospace,monospace;color:#e6c9a9;overflow-wrap:anywhere}
.repair{margin-top:12px}.report{padding:0 0 3px;font-size:13px;color:var(--muted)}
footer{margin-top:13px;color:var(--muted);font-size:13px}a{color:var(--gold);margin-right:13px;text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
@media(max-width:720px){main{width:calc(100% - 30px);padding-top:23px}header{display:block}header p{margin-top:9px}.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><div><small>Ink Studio · Conditional visibility</small><h1>Signal lens</h1></div>
<p>Change the finish, lamp, or wear to see the controls and ports follow their rules.</p></header>
<div class="layout">
<section class="preview" aria-label="Output port preview">
<h2>Output ports</h2>
<figure><img id="image" alt=""><figcaption><b id="map-label"></b><small>80 × 64</small></figcaption></figure>
<nav id="outputs" aria-label="Visible output ports"></nav>
</section>
<aside aria-label="Material inspector">
<h2>Material controls</h2>
<div class="row" data-control="finish"><label for="finish">Finish</label><select id="finish"><option value="enamel">Enamel</option><option value="brushed">Brushed metal</option></select></div>
<div class="row" data-control="signal"><label for="signal">Signal lamp</label><input id="signal" type="checkbox"></div>
<div class="row" data-control="glow"><label for="glow">Glow</label><input id="glow" type="range" min="0" max="1" step=".01"><output for="glow"></output></div>
<div class="row" data-control="grain"><label for="grain">Brush grain</label><input id="grain" type="range" min="0" max="1" step=".01"><output for="grain"></output></div>
<div class="row" data-control="wear"><label for="wear">Wear</label><input id="wear" type="range" min="0" max="1" step=".01"><output for="wear"></output></div>
<div class="row" data-control="patina"><label for="patina">Patina strength</label><input id="patina" type="range" min="0" max="1" step=".01"><output for="patina"></output></div>
<p class="state" id="ports"></p>
<div class="diagnostic" id="diagnostic" role="status">
<h3 id="diagnostic-title"></h3><p id="diagnostic-message"></p><code id="diagnostic-path"></code>
</div>
<button class="repair" id="repair" type="button">Repair rule</button>
</aside>
</div>
<footer><a href="signal-lens.material.json">Editable graph</a><a href="initial-visibility.json">Initial inspector report</a> Ink-rendered maps</footer>
</main>
<script src="toolkit.js"></script>
<script src="inspector.js"></script>
<script>
const { scope, values, pictures } = signalLens;
const get = id => document.getElementById(id);
let active = 'baseColor';
let repaired = false;
const outputButtons = Object.entries(pictures).map(([id, {label}]) => {
  const element = document.createElement('button');
  element.type = 'button';
  element.textContent = label;
  element.addEventListener('click', () => { active = id; show(); });
  get('outputs').append(element);
  return [id, element];
});
for (const row of document.querySelectorAll('[data-control]')) {
  const id = row.dataset.control, control = get(id);
  if (control.type === 'checkbox') control.checked = values[id];
  else control.value = values[id];
  control.addEventListener('input', () => {
    values[id] = control.type === 'checkbox' ? control.checked :
      control.type === 'range' ? control.valueAsNumber : control.value;
    show();
  });
}
get('repair').addEventListener('click', () => {
  repaired = !repaired;
  scope.controls.patina.visibleWhen.args[1] = repaired ? .55 : '0.55';
  get('repair').textContent = repaired ? 'Restore faulty rule' : 'Repair rule';
  show();
});
function show() {
  const report = KIT.procedural.graphVisibility.inspect(scope, { values });
  for (const row of document.querySelectorAll('[data-control]')) {
    const id = row.dataset.control, field = report.controls[id], output = row.querySelector('output');
    row.hidden = !field.visible;
    if (output) output.textContent = values[id].toFixed(2);
  }
  if (!report.outputs[active].visible) active = 'baseColor';
  for (const [id, element] of outputButtons) {
    element.hidden = !report.outputs[id].visible;
    element.setAttribute('aria-pressed', String(id === active));
  }
  get('image').src = pictures[active].file;
  get('image').alt = pictures[active].label + ' for the signal lens';
  get('map-label').textContent = pictures[active].label;
  const inputNames = [['glow', 'glow'], ['grain', 'brush grain']].filter(([key]) => report.inputs[key].visible).map(([, label]) => label);
  get('ports').textContent = 'Conditional input ports · ' + (inputNames.join(', ') || 'none visible');
  const [error] = report.diagnostics;
  get('diagnostic').hidden = !error;
  if (error) {
    get('diagnostic-title').textContent = report.controls[error.id].label + ' rule · field stays visible';
    get('diagnostic-message').textContent = error.message;
    get('diagnostic-path').textContent = error.path;
  }
}
show();
</script>
</body>
</html>
