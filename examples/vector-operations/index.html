<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Press · Ink Studio</title>
<style>
:root{color-scheme:dark;--bg:#151c20;--panel:#212a2e;--line:#3b4a4c;--ink:#f2efdf;--dim:#bac3bc;--mint:#a1dbbe;--brass:#f0cd89}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 72% -20%,#363f3b,transparent 54%),var(--bg);color:var(--ink);font:14px system-ui,sans-serif}
main{max-width:1290px;margin:auto;padding:36px clamp(15px,4vw,50px) 35px}
header{margin:0 0 24px}
h1{font:400 clamp(49px,6.5vw,81px)/.98 Georgia,serif;letter-spacing:-.068em;margin:3px 0 10px}
h2,p{margin:0}h2{font:400 24px/1.06 Georgia,serif;letter-spacing:-.028em}
p{color:var(--dim);line-height:1.43}
.brand,.typed,.mini,output{font:11px ui-monospace,monospace;letter-spacing:.08em}
.brand,.mini{color:var(--brass);text-transform:uppercase}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,390px);gap:18px;align-items:start}
figure,aside{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:0 16px 32px #0c121544}
figure{margin:0;min-width:0}
figcaption{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:5px}
#gridLabel{color:var(--mint);text-align:right}
.bed{background:#171c24;display:grid;place-items:center}
#surface{display:block;width:100%;max-width:595px;height:auto;aspect-ratio:1;image-rendering:pixelated}
aside{padding:14px}
aside h2{margin-bottom:8px}
.vector-stage{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:stretch}
#axes{width:100%;height:auto;display:block;background:#192025;border:1px solid var(--line);border-radius:6px}
.legend{display:grid;gap:6px;align-content:center;color:var(--dim);font-size:11px;white-space:nowrap}
.legend span::before{display:inline-block;content:"";width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--mint)}
.legend span:last-child::before{background:var(--brass)}
.route{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:10px 0 5px}
.route label,.field label{font-size:12px;color:var(--dim)}
button,select,input{font:inherit;accent-color:var(--brass)}
button,select{background:#2b393c;color:var(--ink);border:1px solid #475a5d;border-radius:5px;padding:5px 8px;cursor:pointer}
button:hover,select:hover{border-color:var(--brass)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
#lanes,#casting{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 5px;align-items:center;min-width:0}
.field input,.field select{grid-column:1/-1;margin:0;width:100%;min-width:0}
.field output{color:var(--brass);text-align:right;font-size:10px}
#x-field,#y-field,#z-field,#w-field{grid-template-columns:auto 1fr}
#x-field input,#y-field input,#z-field input,#w-field input{height:15px}
section+section{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.types{display:grid;gap:5px;margin:10px 0 0}
.types div{display:grid;grid-template-columns:1fr auto;gap:7px}
.types dt{font-size:11px;color:var(--dim)}.types dd{margin:0;color:var(--mint);text-align:right;font-size:11px}
footer{border-top:1px solid var(--line);padding-top:9px;margin-top:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
footer a{color:var(--brass);font-size:12px;text-underline-offset:3px}
footer button{font-size:12px}
#save{background:var(--brass);color:#322819;font-weight:650;border-color:var(--brass)}
#error{font-size:12px;color:#ffb7a4;margin-top:8px}#error:empty{display:none}
@media(max-width:780px){.layout{grid-template-columns:1fr;gap:13px}header{margin-bottom:16px}main{padding-top:23px}.vector-stage{max-width:460px}}
</style>
</head>
<body>
<main>
<header><span class="brand">Ink Studio</span><h1>Signal Press</h1><p>Route four vector components into the stamp’s size and turn. Cast a fractional count to lay out the grid.</p></header>
<div class="layout">
  <figure>
    <figcaption><h2>Enamel compass</h2><span class="mini" id="gridLabel"></span></figcaption>
    <div class="bed"><canvas id="surface" width="168" height="168" aria-label="Enamel compass tile preview"></canvas></div>
  </figure>
  <aside aria-label="Graph controls and computed values">
    <section aria-label="Vector controls">
      <h2>Vector</h2>
      <div class="vector-stage">
        <canvas id="axes" width="490" height="208" aria-label="Routed and scaled vectors plotted on two axes"></canvas>
        <div class="legend"><span>Routed</span><span>Scaled</span></div>
      </div>
      <div class="route"><label for="pattern">Swizzle</label><select id="pattern"></select></div>
      <div id="lanes"></div>
      <dl class="types">
        <div><dt>Routed pair</dt><dd class="typed" id="pair"></dd></div>
        <div><dt>Stamp size</dt><dd class="typed" id="size"></dd></div>
        <div><dt>Stamp rotation</dt><dd class="typed" id="turn"></dd></div>
      </dl>
    </section>
    <section aria-label="Cast controls">
      <h2>Casts</h2>
      <div id="casting"></div>
      <dl class="types">
        <div><dt>Cells · number → integer</dt><dd class="typed" id="integer"></dd></div>
        <div><dt>Rim · number → boolean → number</dt><dd class="typed" id="boolean"></dd></div>
      </dl>
    </section>
    <footer><a href="signal-press.material.json" download>Original graph</a><button id="reset" type="button">Reset</button><button id="save" type="button">Save edited graph</button></footer>
    <p id="error" role="alert"></p>
  </aside>
</div>
</main>
<script src="ink-studio.browser.js"></script>
<script src="press-data.js"></script>
<script src="press-live.js"></script>
</body>
</html>
