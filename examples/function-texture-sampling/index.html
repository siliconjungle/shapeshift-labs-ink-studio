<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tideglass · Ink Studio</title>
<style>
:root{color-scheme:dark;--bg:#121c20;--surface:#202e31;--edge:#3a5052;--paper:#f1ede0;--muted:#b2c0bd;--mint:#9cdeca;--sand:#f2cb95}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 68% -18%,#28444b,transparent 61%),var(--bg);color:var(--paper);font:14px system-ui,sans-serif}
main{max-width:1320px;margin:auto;padding:35px clamp(16px,4vw,53px) 34px}
header{margin:0 0 23px}
h1{font:400 clamp(49px,6.3vw,80px)/.97 Georgia,serif;letter-spacing:-.063em;margin:3px 0 11px}
h2{font:400 24px/1.06 Georgia,serif;letter-spacing:-.02em;margin:0}
p{margin:0;line-height:1.46;color:var(--muted)}
.brand,.mini,output,.sample{font:11px ui-monospace,monospace;letter-spacing:.08em}
.brand,.mini{color:var(--sand);text-transform:uppercase}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(315px,378px);gap:19px;align-items:start}
.board{min-width:0}
figure,aside{margin:0;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 13px 35px #0c15194d}
figcaption{padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
figcaption small{font-size:10px;text-align:right}
.preview{position:relative;width:100%;max-width:662px;margin:auto;background-color:#252f3b;background-image:conic-gradient(#334050 25%,#242f3c 0 50%,#334050 0 75%,#242f3c 0);background-size:26px 26px}
#chart{width:100%;height:auto;display:block;image-rendering:pixelated;cursor:crosshair}
#marker{position:absolute;pointer-events:none;width:19px;height:19px;border:2px solid #fff4cb;border-radius:3px;
box-shadow:0 0 0 1px #263345;transform:translate(-50%,-50%)}
.bed{background:#171f26}
aside{padding:14px}
aside h2{margin-bottom:9px}
.sources{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.source{border:1px solid var(--edge);border-radius:6px;overflow:hidden;background:#172127;min-width:0}
.source canvas{display:block;width:100%;height:96px;object-fit:contain;image-rendering:pixelated}
.source span{display:block;padding:5px 7px;font-size:11px;color:var(--muted)}
.source strong{font-weight:600;color:var(--paper)}
.settings,.coords{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:7px 11px}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 6px;align-items:center;min-width:0}
.field label{font-size:11px;color:var(--muted)}
.field output{color:var(--sand);font-size:10px}
.field input,.field select{grid-column:1/-1;width:100%;min-width:0;margin:0}
button,input,select{font:inherit;accent-color:var(--sand)}
button,select,input[type=number]{color:var(--paper);background:#29393c;border:1px solid #4a6263;border-radius:5px;padding:4px 7px}
button,select{cursor:pointer}
button:hover,select:hover{border-color:var(--sand)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
input[type=number],.field select{font-size:11px}
aside section+section{border-top:1px solid var(--edge);margin-top:12px;padding-top:11px}
.stats{display:grid;gap:6px;margin:9px 0 0}
.stats div{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px}
.stats dt{font-size:11px;color:var(--muted)}
.stats dd{margin:0;text-align:right;color:var(--mint);font-size:10px;min-width:0;letter-spacing:0}
footer{margin-top:11px;border-top:1px solid var(--edge);padding-top:9px;display:flex;justify-content:space-between;gap:7px;align-items:center;flex-wrap:wrap}
footer a{color:var(--sand);font-size:12px;text-underline-offset:3px}
footer button{font-size:11px}
#save{background:var(--sand);border-color:var(--sand);color:#2e261c;font-weight:650}
#error{margin-top:7px;font-size:12px;color:#ffb3a1}#error:empty{display:none}
@media(max-width:815px){.layout{grid-template-columns:1fr;gap:13px}.sources{max-width:465px}main{padding-top:23px}header{margin-bottom:16px}}
</style>
</head>
<body>
<main>
<header><span class="brand">Ink Studio</span><h1>Tideglass</h1><p>One function samples a color chart and a grayscale stencil at separate UV coordinates.</p></header>
<div class="layout">
  <section class="board" aria-label="Sampled coating">
    <figure>
      <figcaption><h2>Gilded chart</h2><small class="mini">Click to probe</small></figcaption>
      <div class="bed"><div class="preview">
        <canvas id="chart" width="66" height="60" aria-label="Chart sampled by the glaze function"></canvas>
        <span id="marker" hidden></span>
      </div></div>
    </figure>
  </section>
  <aside aria-label="Texture and sample controls">
    <section aria-label="Texture sampling controls">
      <h2>Texture inputs</h2>
      <div class="sources">
        <div class="source"><canvas id="pigment" width="58" height="54" aria-label="Color source texture"></canvas><span><strong>Pigment</strong> · color</span></div>
        <div class="source"><canvas id="stencil" width="45" height="57" aria-label="Grayscale source texture"></canvas><span><strong>Stencil</strong> · grayscale</span></div>
      </div>
      <div class="settings" id="fields"></div>
    </section>
    <section aria-label="Sampled values">
      <h2>Probe</h2>
      <div class="coords">
        <label class="field"><span>U</span><input id="u" type="number" step=".01"></label>
        <label class="field"><span>V</span><input id="v" type="number" step=".01"></label>
      </div>
      <dl class="stats">
        <div><dt>Stencil UV</dt><dd class="sample" id="stencilUv"></dd></div>
        <div><dt>Pigment · linear RGBA</dt><dd class="sample" id="rgba"></dd></div>
        <div><dt>Stencil value</dt><dd class="sample" id="gray"></dd></div>
        <div><dt>Result · linear RGBA</dt><dd class="sample" id="result"></dd></div>
      </dl>
    </section>
    <footer><a href="tideglass.material.json" download>Original graph</a><button id="reset" type="button">Reset</button><button id="save" type="button">Save edited graph</button></footer>
    <p id="error" role="alert"></p>
  </aside>
</div>
</main>
<script src="ink-studio.browser.js"></script>
<script src="data.js"></script>
<script src="tideglass-preview.js"></script>
<script src="tideglass-live.js"></script>
</body>
</html>
