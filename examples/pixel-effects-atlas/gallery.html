<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ink Effects Atlas</title>
<style>
:root{color-scheme:dark;--paper:#131621;--panel:#1d2332;--ink:#f0e9df;--mute:#a8afc4;--accent:#74dac9;--line:#353f57}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.48 system-ui,sans-serif}
main{width:min(100% - 36px,1180px);margin:36px auto 76px}
h1,h2,p{margin:0}
h1{font-size:clamp(26px,5vw,48px);letter-spacing:-.055em;margin-bottom:17px}
h2{font-size:clamp(22px,3vw,31px);letter-spacing:-.035em}
a{color:var(--accent)}
.stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(245px,.75fr);background:var(--panel);border:1px solid var(--line)}
.stage video{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#090d1a;image-rendering:pixelated}
.info{padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;justify-content:center;gap:12px}
.info p{color:var(--mute);max-width:36ch}.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:18px}
button{font:inherit;color:var(--ink);background:var(--panel);padding:0;border:1px solid var(--line);text-align:left;cursor:pointer}
button:hover,button:focus-visible{border-color:#94ace1}button[aria-pressed="true"]{border:1px solid var(--accent)}
button img{display:block;width:100%;aspect-ratio:1;object-fit:cover;image-rendering:pixelated}
button span{display:block;padding:8px 10px;font-size:13px}
@media(max-width:640px){main{margin-top:18px}.stage{grid-template-columns:1fr}.info{padding:14px}.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<h1>Ink Effects Atlas</h1>
<section class="stage" aria-label="Selected study">
<video id="preview" controls muted playsinline preload="metadata"></video>
<div class="info">
  <h2 id="name"></h2><p id="description"></p>
  <div class="links"><a id="download" download>Download clip</a><a id="reference" rel="noopener">Source study</a></div>
</div>
</section>
<nav class="list" aria-label="Effects" id="list"></nav>
</main>
<script>
const studies=/*STUDIES*/;
const ui = Object.fromEntries(['preview','name','description','download','reference','list'].map(id=>[id,document.getElementById(id)]));
const buttons = new Map();
function select(row) {
  for (const [id, button] of buttons) button.setAttribute('aria-pressed',String(id===row.id));
  ui.name.textContent=row.name; ui.description.textContent=row.description;
  ui.preview.poster=row.poster;ui.preview.src=row.clip;ui.preview.loop=row.loop;
  ui.download.href=row.clip;ui.reference.href=row.reference;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)ui.preview.play().catch(()=>{});
}
function activate(id) { const row=studies.find(x=>x.id===id)??studies[0];select(row); }
for(const row of studies){
  const button=document.createElement('button'), image=document.createElement('img'), label=document.createElement('span');
  button.type='button';image.src=row.poster;image.alt='';label.textContent=row.name;
  button.append(image,label);buttons.set(row.id,button);ui.list.append(button);
  button.addEventListener('click',()=>{history.replaceState(null,'','#'+row.id);activate(row.id);});
}
addEventListener('hashchange',()=>activate(location.hash.slice(1)));
activate(location.hash.slice(1));
</script>
</body>
</html>
