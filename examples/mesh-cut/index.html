<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesh Cuts · Ink Studio</title>
<style>
  :root { color-scheme:dark; background:#111c23; color:#e2eae5; font:15px system-ui,sans-serif; }
  * { box-sizing:border-box; }
  main { width:min(1120px,100%); margin:auto; padding:clamp(20px,5vw,56px); }
  h1 { margin:0 0 24px; font:400 clamp(36px,5vw,60px)/1.05 Georgia,serif; }
  h2 { font-size:14px; font-weight:600; margin:0 0 8px; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:0 0 16px; }
  .bar label { display:flex; align-items:center; gap:7px; }
  button,select { font:inherit; color:inherit; background:#22343c; border:1px solid #476068; border-radius:5px; padding:7px 11px; }
  button { cursor:pointer; }
  button:disabled { cursor:default; opacity:.45; }
  #apply { background:#96c7b4; color:#102821; border-color:#96c7b4; font-weight:600; }
  button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid #9cdbcd; outline-offset:3px; }
  .views { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:20px 0 15px; }
  canvas { width:100%; height:auto; display:block; border:1px solid #314950; border-radius:6px; image-rendering:pixelated; }
  canvas[data-tool="knife"] { cursor:crosshair; touch-action:none; }
  #status { color:#b6cfc3; min-height:1.5em; }
  #status[data-error] { color:#ffc596; }
  [hidden] { display:none !important; }
  @media(max-width:680px) { .views { grid-template-columns:1fr; } }
</style>
<main>
  <h1>Mesh Cuts</h1>
  <div class="bar">
    <label>Tool <select id="tool"><option value="plane">Plane</option><option value="knife">Knife</option></select></label>
    <label id="axis-control">Axis <select id="axis"><option value="2">Z</option><option value="0">X</option><option value="1">Y</option></select></label>
    <label id="position-control">Position <input id="position" type="range" min="0" max="1000" value="500"></label>
    <label>Cap <select id="cap"><option value="triangles">Triangles</option><option value="ngon">Polygon</option><option value="none">Open</option></select></label>
    <label><input type="checkbox" id="split" checked> Detach pieces</label>
  </div>
  <div class="bar">
    <label for="load">Open topology JSON</label><input type="file" id="load" accept=".json,application/json">
    <button id="point" hidden>Undo point</button><button id="clear" hidden>Clear path</button>
  </div>
  <div class="views">
    <section><h2>Source</h2><canvas id="source" width="320" height="235" aria-label="Source mesh and cut path"></canvas></section>
    <section><h2>Cut preview</h2><canvas id="preview" width="320" height="235" aria-label="Preview of cut pieces"></canvas></section>
  </div>
  <p id="status" aria-live="polite"></p>
  <div class="bar">
    <button id="apply">Apply cut</button><button id="undo">Undo cut</button>
    <button id="request">Save request</button><button id="save">Save mesh</button>
  </div>
</main>
<script src="../../dist/ink-studio.browser.js"></script>
<script src="fixture.js"></script>
<script src="demo.js"></script>
</html>
