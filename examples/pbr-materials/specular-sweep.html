<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Copper Wire Sweep · Ink Studio</title>
<style>
  :root{color-scheme:dark;--bg:#101620;--panel:#171e2a;--stroke:#303b49;--ink:#f4e8d6;--muted:#b3bdca;--accent:#edae78}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;margin:0}
  main{width:min(1100px,100%);margin:auto;padding:clamp(22px,5vw,64px) clamp(16px,4vw,40px)}
  h1{font:500 clamp(34px,6vw,66px)/1.08 Georgia,serif;letter-spacing:-.035em;margin:0}
  header p{margin:8px 0 24px;color:var(--muted)}
  .comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  figure{margin:0;background:var(--panel);border:1px solid var(--stroke);border-radius:9px;overflow:hidden}
  canvas{background:#111723;display:block;width:100%;aspect-ratio:112/54;image-rendering:pixelated}
  figcaption{padding:11px 14px;border-top:1px solid var(--stroke);font-weight:650}
  .controls{display:flex;gap:14px;align-items:center;margin:20px 0 30px}
  button{color:var(--ink);background:var(--panel);border:1px solid var(--stroke);border-radius:6px;padding:8px 12px;min-width:64px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  input{accent-color:var(--accent);flex:1;min-width:0}
  output{width:4ch;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
  table{border-collapse:collapse;width:100%;text-align:left;font-variant-numeric:tabular-nums}
  caption{text-align:left;font-weight:650;padding-bottom:6px}
  th,td{padding:8px 4px;border-bottom:1px solid var(--stroke)}
  thead th,small{color:var(--muted);font-weight:400}
  small{display:block;margin-top:9px}
  @media(max-width:560px){.comparison{grid-template-columns:1fr;gap:8px}.controls{gap:8px}figcaption{padding:6px 10px}}
</style>
<main>
  <header>
    <h1>Copper Wire Sweep</h1>
    <p>Move the light across the wire and compare the palette-resolved highlights.</p>
  </header>
  <div class="comparison">
    <figure><canvas aria-label="Wire rendered with a center sample"></canvas><figcaption>Center sample</figcaption></figure>
    <figure><canvas aria-label="Wire rendered with four coverage samples"></canvas><figcaption>Four samples per art pixel</figcaption></figure>
  </div>
  <div class="controls">
    <button id="play" disabled>Play</button>
    <label for="light">Light angle</label>
    <input id="light" type="range" min="0" disabled>
    <output for="light" id="angle"></output>
  </div>
  <table>
    <caption>Native-resolution motion audit</caption>
    <thead><tr><th scope="col">Finding</th><th scope="col">Center</th><th scope="col">Coverage</th></tr></thead>
    <tbody id="audit"></tbody>
  </table>
  <small id="details"></small>
</main>
<script type="module">
const {width,height,count,data,angles} = @SWEEP@;
const play = document.getElementById('play'), light = document.getElementById('light'), angle = document.getElementById('angle');
const loaded = await Promise.all(data.map(async ({image})=>{
  const sheet = new Image();
  sheet.src = 'data:image/png;base64,'+image;
  await sheet.decode();
  return sheet;
}));
const contexts = Array.from(document.querySelectorAll('canvas'), canvas=>{
  canvas.width = width;
  canvas.height = height;
  return canvas.getContext('2d');
});
function draw(index) {
  light.value = index;
  angle.value = Math.round(angles[index])+'°';
  for (const [i,ctx] of contexts.entries()) ctx.drawImage(loaded[i],0,index*height,width,height,0,0,width,height);
}
let timer;
function pause() {
  clearInterval(timer);
  timer = undefined;
  play.textContent = 'Play';
}
light.max = count-1;
light.addEventListener('input',()=>{pause();draw(Number(light.value));});
play.addEventListener('click',()=>{
  if (timer) return pause();
  play.textContent = 'Pause';
  timer = setInterval(()=>draw((Number(light.value)+1)%count),100);
});
const audit = document.getElementById('audit');
for (const [label,key] of [['Cluster splits','splits'],['Pixels in split or merged clusters','clusterPixels'],['One-frame flicker pixels','flicker']]) {
  const row = audit.insertRow(), heading = document.createElement('th');
  heading.scope = 'row';
  heading.textContent = label;
  row.append(heading);
  for (const entry of data) row.insertCell().textContent = entry[key].toLocaleString('en-US');
}
document.getElementById('details').textContent = count+' headless frames at '+width+' × '+height+' art pixels';
draw(Math.round(count*.65));
play.disabled = light.disabled = false;
document.documentElement.dataset.ready = 'true';
</script>
</html>
