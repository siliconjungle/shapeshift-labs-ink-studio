<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Vesper Relay · Ink Studio</title>
<style>
  :root{color-scheme:dark;--ink:#e9e7da;--muted:#acaab6;--bronze:#cba77e;--line:#35343f;--base:#13141b}
  *{box-sizing:border-box}body{margin:0;background:#0e0f15;color:var(--ink);font:14px/1.45 system-ui,sans-serif}
  main{width:min(1180px,100%);margin:auto;padding:28px 34px 25px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin:0 0 17px}
  h1{margin:0;font:500 clamp(34px,5vw,62px)/1.08 Optima,'Trebuchet MS',sans-serif;letter-spacing:-.035em}
  .edition,.note,button,output{font-family:ui-monospace,'SF Mono',Menlo,monospace}
  .edition{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);margin:0 0 3px}
  .note{font-size:11px;color:var(--muted);margin:0 0 4px;white-space:nowrap}
  .viewer{border:1px solid var(--line);background:var(--base);border-radius:12px;overflow:hidden}
  figure{padding:0;margin:0;position:relative;background:#171821}
  canvas,img{width:100%;height:auto;display:block;image-rendering:pixelated}
  [hidden]{display:none!important}
  .state{position:absolute;right:18px;bottom:13px;display:flex;align-items:center;gap:7px;
    font:10px ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:#d5c7b4;
    background:#12141bdf;padding:6px 8px;border:1px solid #4a4252;border-radius:4px}
  .state:before{content:'';width:5px;height:5px;border-radius:50%;background:#90d8bb}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 16px;border-top:1px solid var(--line)}
  .lights,.modes{display:flex;align-items:center;gap:8px}
  .lights{flex:1;max-width:365px} .lights label{white-space:nowrap} .lights input{min-width:60px;width:100%;accent-color:var(--bronze)}
  output{min-width:43px;text-align:right;color:var(--bronze);font-size:12px}
  button{border:1px solid #504c5b;border-radius:5px;background:#22232d;color:var(--ink);padding:7px 9px;
    font-size:11px;white-space:nowrap;cursor:pointer}
  button:hover,button[aria-pressed=true]{border-color:var(--bronze);color:#ffe4ba;background:#332a2b}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #f7c48a;outline-offset:3px}
  button:disabled,input:disabled{opacity:.45;cursor:default}
  dl{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:17px 0 0}
  dl div{min-width:0;padding:1px 15px;border-left:1px solid var(--line)}dl div:first-child{padding-left:1px;border:0}
  dt{font-size:13px;font-weight:640;line-height:1.3}dd{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.25}
  a{color:#ead0a7;text-underline-offset:3px}
  .message{color:#e7a9a2;margin:8px 0 0}.message:empty{display:none}
  @media(max-width:760px){
    main{padding:19px 13px}header{display:block}.note{margin:4px 0}.edition{font-size:10px}
    .bar{justify-content:flex-start;flex-wrap:wrap;padding:10px;gap:12px}.lights{flex-basis:100%;max-width:440px}
    dl{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));row-gap:12px}
    dl div{padding:0 10px;border:0}dl div:first-child{padding-left:10px}
  }
</style>
<main>
  <header>
    <div><p class="edition">Ink Studio / Material study</p><h1>Vesper Relay</h1></div>
    <p class="note">One lighting setup · Five render types</p>
  </header>
  <section class="viewer" aria-label="Vesper Relay material viewer">
    <figure>
      <canvas width="520" height="300" hidden aria-label="Vesper Relay assembly under a movable studio light"></canvas>
      <img id="still" width="520" height="300" alt="Vesper Relay assembly with a brass collar, teal lens and copper cables" src="data:image/png;base64,@REFERENCE@">
      <span class="state" id="backend">Headless still</span>
    </figure>
    <div class="bar">
      <div class="lights">
        <button id="play" disabled aria-pressed="false">Play</button>
        <label for="light">Key light</label>
        <input id="light" type="range" min="-180" max="180" value="36" disabled>
        <output id="degrees" for="light">36°</output>
      </div>
      <div class="modes" aria-label="Material preview">
        <button data-mode="physical" aria-pressed="true" disabled>PBR</button>
        <button data-mode="palette" aria-pressed="false" disabled>Ink palette</button>
        <button data-mode="off" aria-pressed="false" disabled>PBR off</button>
        <button data-mode="export" aria-pressed="false" disabled>Headless</button>
      </div>
      <a id="download" download="vesper-relay.png">Save still</a>
    </div>
  </section>
  <dl aria-label="Scene materials">
    <div><dt>Copper collar</dt><dd>Indexed mesh</dd></div>
    <div><dt>Signal lens</dt><dd>Gaussian splats</dd></div>
    <div><dt>Switchboard</dt><dd>Object-local texels</dd></div>
    <div><dt>Status badge</dt><dd>Surface projection</dd></div>
    <div><dt>Wire assembly</dt><dd>Finite-curve splats</dd></div>
  </dl>
  <p class="message" id="message" role="status"></p>
</main>
<script type="module">
const unpack = async value => new Response(
  new Blob([Uint8Array.from(atob(value),c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))
).text();
/* SCENE */
/* DEMO */
</script>
</html>
